<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>전술 워크스페이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: three-pane editor. Sidebar (squads, plays, match) · schematic canvas with toolbar · inspector for the selection.
   Phones: sidebar becomes a segmented bar, inspector becomes a bottom sheet. */
:root {
  --bg: #eef1f0;          /* 앱 바탕 (회녹색 기운) */
  --panel: #f8faf9;
  --canvas: #e3e8e6;
  --line: #d3dad7;
  --ink: #17201c;
  --sub: #5a6a63;
  --accent: #0f7a5c;      /* 피치 그린 계열 선택색 */
  --accent-soft: #d5ece4;
  --pitch: #f8faf9;
  --pitch-line: #9fb1a9;
  --run: #c2410c; --pass: #1d4ed8;
  --font-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121715; --panel: #181e1b; --canvas: #0f1312; --line: #2a332f; --ink: #e5ece8; --sub: #93a39b;
  --accent: #4cc79d; --accent-soft: #1d3a30; --pitch: #18201c; --pitch-line: #3f524a; --run: #fb923c; --pass: #7aa2ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121715; --panel: #181e1b; --canvas: #0f1312; --line: #2a332f; --ink: #e5ece8; --sub: #93a39b;
  --accent: #4cc79d; --accent-soft: #1d3a30; --pitch: #18201c; --pitch-line: #3f524a; --run: #fb923c; --pass: #7aa2ff; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; padding-inline: 0; padding-block: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr) 300px; grid-template-rows: 48px minmax(0, 1fr); height: 100%; min-height: 560px; }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.bar .logo { font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.bar .logo i { font-style: normal; display: inline-block; width: 10px; height: 14px; border: 2px solid var(--accent); margin-right: 8px; vertical-align: -2px; }
.crumb { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb b { color: var(--ink); font-weight: 600; }
.bar .grow { flex: 1; }
.kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--sub); background: var(--panel); }
.cmd { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--sub); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; min-height: 32px; }
.btn:hover { border-color: var(--sub); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* Sidebar */
.side { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 8px; overflow-y: auto; display: grid; align-content: start; gap: 16px; }
.grp h3 { margin: 0 0 4px; padding: 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); display: flex; justify-content: space-between; }
.item { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 6px; padding: 6px 8px; text-align: left; cursor: pointer; min-height: 32px; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.item .meta { margin-left: auto; color: var(--sub); font-size: 12px; font-weight: 400; }
.item .ic { width: 16px; height: 16px; border: 1.5px solid currentColor; border-radius: 3px; opacity: .6; flex: none; }
.item .ic.play { border-radius: 50%; }

/* Canvas */
.center { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; background: var(--canvas); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.segc { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.segc button { border: 0; background: transparent; padding: 4px 9px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; color: var(--sub); min-height: 30px; }
.segc button + button { border-left: 1px solid var(--line); }
.segc button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.tools select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 8px; font-family: var(--font-mono); min-height: 30px; }
.tools .lbl { color: var(--sub); font-size: 12px; }
.stagec { display: grid; place-items: center; padding: 20px; min-height: 0; overflow: auto; }
.pitch { position: relative; height: min(100%, 760px); max-height: calc(100vh - 160px); aspect-ratio: 68 / 100; max-width: 100%; background: var(--pitch); border: 1px solid var(--pitch-line); touch-action: none; user-select: none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 10% 10%; background-position: -1px -1px; }
.pitch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: var(--pitch-line); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.pitch svg.ov { pointer-events: none; }
.run { fill: none; stroke: var(--run); stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.pass { fill: none; stroke: var(--pass); stroke-width: 2; vector-effect: non-scaling-stroke; }
.node { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid var(--c); background: var(--panel); color: var(--ink); font-family: var(--font-mono); font-weight: 600; font-size: 12px; display: grid; place-items: center; cursor: grab; padding: 0; transition: box-shadow .12s; }
.node .n { position: absolute; left: 34px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-family: var(--font-ui); font-size: 12px; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; }
.node.sel { background: var(--c); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
.node.dragging { cursor: grabbing; }
.node .co { position: absolute; top: 33px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--sub); white-space: nowrap; pointer-events: none; }
.ballx { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink); border: 2px solid var(--panel); }
.status { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--sub); font-size: 12px; }
.timeline { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.tl-step { flex: 1 1 120px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 6px 10px; text-align: left; cursor: pointer; position: relative; overflow: hidden; min-width: 0; }
.tl-step b { font-family: var(--font-mono); font-size: 11px; color: var(--sub); display: block; }
.tl-step span { font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-step[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tl-step i { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }

/* Inspector */
.insp { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.sec h4 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); display: flex; justify-content: space-between; align-items: center; }
.big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.big .num { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; font-family: var(--font-mono); font-size: 14px; display: grid; place-items: center; }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; align-items: center; font-size: 13px; }
.kv dt { color: var(--sub); } .kv dd { margin: 0; }
.field { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 8px 10px; resize: vertical; min-height: 84px; line-height: 1.55; }
.inputx { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 6px 10px; }
.sw { display: flex; gap: 6px; }
.sw button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--panel); background: var(--c); cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.meter { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); }
.plist { display: grid; gap: 2px; }
.prow { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; border: 0; background: none; text-align: left; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
.prow:hover { background: var(--bg); }
.prow .mono { color: var(--sub); text-align: right; }
.prow .st { font-size: 11px; color: var(--sub); }
.prow .st.ok { color: var(--accent); }
.short { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; color: var(--sub); }
pre.brief { margin: 0; white-space: pre-wrap; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--panel); border-radius: 8px; padding: 8px 8px 8px 14px; font-size: 13px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast button { border: 0; background: transparent; color: var(--accent-soft); font-weight: 600; cursor: pointer; padding: 4px 8px; }
.mtabs { display: none; }
.sheet-handle { display: none; }

@media (max-width: 1080px) { .app { grid-template-columns: 200px minmax(0, 1fr) 270px; } }
@media (max-width: 820px) {
  body { height: auto; }
  .app { display: block; height: auto; }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; height: 48px; }
  .bar .cmd, .bar .crumb { display: none; }
  .side { display: none; }
  .mtabs { display: flex; gap: 4px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .mtabs button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
  .mtabs button[aria-current="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .stagec { padding: 16px; }
  .pitch { height: auto; width: 100%; max-height: none; }
  .node { width: 28px; height: 28px; margin: -14px 0 0 -14px; } .node .co { display: none; } .node .n { left: 50%; top: 30px; transform: translateX(-50%); font-size: 11px; }
  .insp { border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.08); margin-top: -8px; position: relative; }
  .sheet-handle { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
  .toast { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <span class="logo"><i></i>Squad Maker</span>
    <span class="crumb" id="crumb"></span>
    <span class="grow"></span>
    <button class="cmd" type="button" id="cmdBtn">명령 검색 <span class="kbd">⌘K</span></button>
    <button class="btn" type="button" id="themeBtn" aria-label="테마 전환">◐</button>
    <button class="btn primary" type="button" id="shareBtn">공유</button>
  </header>
  <nav class="side" id="side" aria-label="작업 목록"></nav>
  <main class="center">
    <div class="mtabs" id="mtabs"></div>
    <div class="tools" id="tools"></div>
    <div class="stagec">
      <div class="pitch" id="pitch">
        <svg class="lines" viewBox="0 0 68 100" preserveAspectRatio="none" aria-hidden="true">
          <rect x="0" y="0" width="68" height="100"/><line x1="0" y1="50" x2="68" y2="50"/><circle cx="34" cy="50" r="8"/>
          <rect x="14" y="0" width="40" height="16"/><rect x="24" y="0" width="20" height="6"/>
          <rect x="14" y="84" width="40" height="16"/><rect x="24" y="94" width="20" height="6"/>
        </svg>
        <svg class="ov" id="ov" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </div>
    <div id="foot"></div>
  </main>
  <aside class="insp" id="insp" aria-label="속성"></aside>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* squad-maker UX concept shared core — same data and behavior for all 3 concepts.
   Coordinates: x 0..100 (left→right), y 0..100 (opponent goal top → own goal bottom). */
const SM = (() => {
  const TEAM = { name: 'FC 한강 유나이티드', mode: '9vs9' };
  const MODES = ['5vs5', '6vs6', '7vs7', '8vs8', '9vs9', '10vs10', '11vs11'];
  const FORMATIONS = ['3-3-2', '3-2-3', '4-3-1', '2-4-2', '3-4-1'];
  const PLAYERS = [
    { id: 1, num: 1,  name: '김도윤', role: 'GK', color: '#e0583c' },
    { id: 2, num: 2,  name: '박지훈', role: 'DF', color: '#2f6fd6' },
    { id: 3, num: 4,  name: '이서준', role: 'DF', color: '#2f6fd6' },
    { id: 4, num: 5,  name: '최민재', role: 'DF', color: '#2f6fd6' },
    { id: 5, num: 7,  name: '정우진', role: 'MF', color: '#2f6fd6' },
    { id: 6, num: 6,  name: '강하늘', role: 'MF', color: '#2f6fd6' },
    { id: 7, num: 8,  name: '윤시우', role: 'MF', color: '#2f6fd6' },
    { id: 8, num: 11, name: '한결',   role: 'FW', color: '#e8b730' },
    { id: 9, num: 9,  name: '오태양', role: 'FW', color: '#e8b730' },
  ];
  const SQUAD_LABEL = { basic: '기본', attack: '공격', defense: '수비' };

  function layout(formation) {
    const rows = formation.split('-').map(Number);
    const pos = { 1: { x: 50, y: 92 } };
    let id = 2;
    rows.forEach((n, r) => {
      const y = rows.length === 1 ? 50 : 74 - (r * (74 - 22)) / (rows.length - 1);
      for (let i = 0; i < n; i++) {
        const x = n === 1 ? 50 : 16 + (i * 68) / (n - 1);
        pos[id++] = { x: Math.round(x), y: Math.round(y) };
      }
    });
    return pos;
  }
  function roleFor(formation, id) {
    if (id === 1) return 'GK';
    const rows = formation.split('-').map(Number);
    let c = 2;
    for (let r = 0; r < rows.length; r++) {
      if (id < c + rows[r]) return r === 0 ? 'DF' : r === rows.length - 1 ? 'FW' : 'MF';
      c += rows[r];
    }
    return 'MF';
  }

  const squads = {
    basic:   { formation: '3-3-2', pos: layout('3-3-2'),
               teamNote: '라인 간격 15m 유지. 볼을 잃으면 5초 즉시 압박, 실패하면 3-3-2 블록으로 복귀.',
               notes: { 1: '골킥은 짧게, 2번·5번 쪽으로 시작', 6: '빌드업 때 센터백 사이로 내려와 3-1 형태 만들기', 8: '상대 센터백 뒷공간 침투, 오프사이드 라인 계속 확인' } },
    attack:  { formation: '3-2-3', pos: layout('3-2-3'),
               teamNote: '측면 폭을 최대로. 크로스는 니어·파 포스트에 한 명씩.',
               notes: { 2: '왼쪽 오버래핑 적극 가담', 9: '파 포스트 쇄도' } },
    defense: { formation: '4-3-1', pos: layout('4-3-1'),
               teamNote: '하프라인 아래 블록. 중앙 차단 우선, 측면은 허용.',
               notes: { 6: '상대 10번 전담 마크' } },
  };

  const pattern = {
    name: '왼쪽 측면 오버래핑',
    start: { ...layout('3-3-2') },
    startBall: 6,
    steps: [
      { label: '6 → 7 횡패스, 2번 전진', moves: { 2: { x: 10, y: 50 }, 5: { x: 22, y: 40 } }, ball: 5 },
      { label: '7 → 2 스루패스, 11번 니어 침투', moves: { 2: { x: 9, y: 26 }, 8: { x: 34, y: 14 }, 5: { x: 30, y: 34 } }, ball: 2 },
      { label: '2번 컷백 크로스, 9번 파 포스트', moves: { 9: { x: 62, y: 12 }, 8: { x: 40, y: 10 } }, ball: 9 },
    ],
  };
  function patternKeyframes() {
    const frames = [{ pos: { ...pattern.start }, ball: pattern.startBall }];
    pattern.steps.forEach((s) => {
      const prev = frames[frames.length - 1];
      frames.push({ pos: { ...prev.pos, ...s.moves }, ball: s.ball });
    });
    return frames;
  }
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  /* frame(step, t): positions while animating from keyframe step → step+1 */
  function frame(step, t) {
    const k = patternKeyframes();
    const a = k[step], b = k[Math.min(step + 1, k.length - 1)];
    const e = ease(Math.max(0, Math.min(1, t)));
    const pos = {};
    for (const id in a.pos) pos[id] = { x: a.pos[id].x + (b.pos[id].x - a.pos[id].x) * e, y: a.pos[id].y + (b.pos[id].y - a.pos[id].y) * e };
    const ba = a.pos[a.ball], bb = b.pos[b.ball];
    const ball = { x: ba.x + (bb.x - ba.x) * e + 2.4, y: ba.y + (bb.y - ba.y) * e - 2.4 };
    return { pos, ball };
  }
  /* arrows for step index s (0-based step being edited): run arrows + pass arrow */
  function arrows(s) {
    const k = patternKeyframes();
    const a = k[s], b = k[s + 1];
    if (!b) return [];
    const out = [];
    for (const id in pattern.steps[s].moves) out.push({ kind: 'run', id: +id, from: a.pos[id], to: b.pos[id] });
    if (a.ball !== b.ball) out.push({ kind: 'pass', from: a.pos[a.ball], to: b.pos[b.ball] });
    return out;
  }

  const match = { opponent: '강서 FC', date: '10월 12일 (일) 09:00', venue: '잠실 보조구장', memo: '상대는 4-4 라인 수비가 강함. 측면 오버래핑으로 수적 우위를 만든다.' };

  function shareText(sq) {
    const s = squads[sq];
    const lines = [`[${TEAM.name}] ${SQUAD_LABEL[sq]} 스쿼드 · ${TEAM.mode} · ${s.formation}`, `vs ${match.opponent} · ${match.date}`, '', `■ 팀 지침`, s.teamNote, '', '■ 선수별'];
    PLAYERS.forEach((p) => { if (s.notes[p.id]) lines.push(`${p.num} ${p.name}: ${s.notes[p.id]}`); });
    return lines.join('\n');
  }

  /* Pointer drag inside a container. map(clientX, clientY) → {x,y} in 0..100 coords. */
  function draggable(el, map, { onMove, onEnd, onTap } = {}) {
    let start = null, moved = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY }; moved = false;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (!start) return;
      if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 4) return;
      moved = true; el.classList.add('dragging');
      const p = map(e.clientX, e.clientY);
      onMove && onMove({ x: Math.max(3, Math.min(97, p.x)), y: Math.max(3, Math.min(97, p.y)) });
    });
    const end = () => {
      if (!start) return;
      el.classList.remove('dragging');
      if (moved) onEnd && onEnd(); else onTap && onTap();
      start = null;
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap && onTap(); } });
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
  }
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  return { TEAM, MODES, FORMATIONS, PLAYERS, SQUAD_LABEL, squads, layout, roleFor, pattern, patternKeyframes, frame, arrows, match, shareText, draggable, copy, reduced };
})();

</script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const st = { app: 'squad', squad: 'basic', sel: 6, step: 1, playing: false };
const P = (id) => SM.PLAYERS.find((p) => p.id === +id);
const COLORS = ['#0f7a5c', '#2f6fd6', '#e0583c', '#e8b730', '#7c3aed', '#475569'];
const pitch = $('#pitch');
const toPct = (cx, cy) => { const r = pitch.getBoundingClientRect(); return { x: (cx - r.left) / r.width * 100, y: (cy - r.top) / r.height * 100 }; };
const fmt = (p) => `x ${String(Math.round(p.x)).padStart(2, '0')} · y ${String(Math.round(p.y)).padStart(2, '0')}`;
let undo = null, tT;
function toast(msg, withUndo) {
  const t = $('#toast'); t.innerHTML = `<span>${msg}</span>` + (withUndo ? '<button type="button" id="undoBtn">되돌리기 <span class="kbd">⌘Z</span></button>' : ''); t.hidden = false;
  if (withUndo) $('#undoBtn').onclick = doUndo;
  clearTimeout(tT); tT = setTimeout(() => (t.hidden = true), 5000);
}
function doUndo() { if (!undo) return; undo(); undo = null; $('#toast').hidden = true; render(); }

const views = [
  { app: 'squad', sq: 'basic', label: '기본 스쿼드' }, { app: 'squad', sq: 'attack', label: '공격 스쿼드' }, { app: 'squad', sq: 'defense', label: '수비 스쿼드' },
  { app: 'pattern', label: SM.pattern.name }, { app: 'strategy', label: '매치 전략' },
];
const isCur = (v) => v.app === st.app && (v.app !== 'squad' || v.sq === st.squad);
const go = (v) => { st.app = v.app; if (v.sq) st.squad = v.sq; st.playing = false; cancelAnimationFrame(raf); render(); };

function side() {
  const note = (k) => SM.PLAYERS.filter((p) => SM.squads[k].notes[p.id]).length;
  $('#side').innerHTML = `
    <div class="grp"><h3>스쿼드 <span class="kbd">1–3</span></h3>${views.slice(0, 3).map((v, i) => `<button class="item" data-v="${i}" aria-current="${isCur(v)}"><span class="ic"></span>${v.label}<span class="meta mono">${SM.squads[v.sq].formation}</span></button>`).join('')}</div>
    <div class="grp"><h3>전술 패턴 <span>3</span></h3><button class="item" data-v="3" aria-current="${isCur(views[3])}"><span class="ic play"></span>${SM.pattern.name}<span class="meta">3단계</span></button><button class="item"><span class="ic play"></span>전방 압박 트랩<span class="meta">2단계</span></button><button class="item"><span class="ic play"></span>코너킥 니어 플릭<span class="meta">4단계</span></button></div>
    <div class="grp"><h3>경기</h3><button class="item" data-v="4" aria-current="${isCur(views[4])}"><span class="ic"></span>vs ${SM.match.opponent}<span class="meta">10/12</span></button></div>
    <div class="grp"><h3>지침 작성</h3>${Object.keys(SM.SQUAD_LABEL).map((k) => `<div class="item" style="cursor:default">${SM.SQUAD_LABEL[k]}<span class="meta mono">${note(k)}/9</span></div>`).join('')}</div>`;
  $('#side').querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => go(views[+b.dataset.v])));
  $('#mtabs').innerHTML = views.map((v, i) => `<button data-v="${i}" aria-current="${isCur(v)}">${v.label}</button>`).join('');
  $('#mtabs').querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => go(views[+b.dataset.v])));
  const cur = views.find(isCur);
  $('#crumb').innerHTML = `${SM.TEAM.name} / <b>${cur ? cur.label : ''}</b>`;
}

function tools() {
  const s = SM.squads[st.squad];
  if (st.app === 'pattern') {
    $('#tools').innerHTML = `<span class="lbl">도구</span><div class="segc"><button aria-pressed="false">선택</button><button aria-pressed="true">움직임</button><button aria-pressed="false">패스</button></div><span class="grow" style="flex:1"></span><button class="btn">GIF</button><button class="btn">전체 GIF</button>`;
    return;
  }
  $('#tools').innerHTML = `<span class="lbl">인원</span><div class="segc">${SM.MODES.map((m) => `<button aria-pressed="${m === SM.TEAM.mode}">${m.replace('vs', 'v')}</button>`).join('')}</div>
    <span class="lbl">포메이션</span><select id="form" aria-label="포메이션">${SM.FORMATIONS.map((f) => `<option${f === s.formation ? ' selected' : ''}>${f}</option>`).join('')}</select>
    <button class="btn" id="resetBtn">배치 초기화</button>`;
  $('#form').onchange = (e) => { const prev = { f: s.formation, pos: s.pos }; s.formation = e.target.value; s.pos = SM.layout(s.formation); undo = () => { s.formation = prev.f; s.pos = prev.pos; }; render(); toast(`포메이션 ${prev.f} → ${s.formation}`, true); };
  $('#resetBtn').onclick = () => { const prev = s.pos; s.pos = SM.layout(s.formation); undo = () => (s.pos = prev); render(); toast('배치를 초기화했어요', true); };
}

function nodes(pos, ball) {
  pitch.querySelectorAll('.node,.ballx').forEach((n) => n.remove());
  SM.PLAYERS.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'node' + (st.sel === p.id && st.app === 'squad' ? ' sel' : '');
    b.style.setProperty('--c', p.color); b.style.left = pos[p.id].x + '%'; b.style.top = pos[p.id].y + '%';
    b.innerHTML = `${p.num}<span class="n">${p.name}</span>${st.sel === p.id && st.app === 'squad' ? `<span class="co mono">${fmt(pos[p.id])}</span>` : ''}`;
    b.setAttribute('aria-label', `${p.num}번 ${p.name}`);
    pitch.appendChild(b);
    if (st.app === 'squad') {
      let before;
      SM.draggable(b, toPct, {
        onMove: (q) => { before ??= { ...SM.squads[st.squad].pos[p.id] }; SM.squads[st.squad].pos[p.id] = q; b.style.left = q.x + '%'; b.style.top = q.y + '%'; const co = b.querySelector('.co'); if (co) co.textContent = fmt(q); },
        onEnd: () => { const sq = st.squad, prev = before; before = null; undo = () => (SM.squads[sq].pos[p.id] = prev); st.sel = p.id; render(); toast(`${p.name} 위치 이동`, true); },
        onTap: () => { st.sel = p.id; render(); },
      });
    } else b.tabIndex = -1;
  });
  if (ball) { const e = document.createElement('div'); e.className = 'ballx'; e.style.left = ball.x + '%'; e.style.top = ball.y + '%'; pitch.appendChild(e); }
}
function overlay(step) {
  $('#ov').innerHTML = step == null ? '' : `<defs><marker id="ar" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:var(--run)"/></marker><marker id="ap" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:var(--pass)"/></marker></defs>` +
    SM.arrows(step).map((a) => `<line class="${a.kind}" x1="${a.from.x}" y1="${a.from.y}" x2="${a.to.x}" y2="${a.to.y}" marker-end="url(#${a.kind === 'run' ? 'ar' : 'ap'})"/>`).join('');
}

function foot() {
  const s = SM.squads[st.squad];
  if (st.app === 'pattern') {
    $('#foot').innerHTML = `<div class="timeline"><button class="btn primary" id="play" style="min-width:76px">${st.playing ? '정지' : '▶ 재생'}</button>${SM.pattern.steps.map((x, i) => `<button class="tl-step" data-step="${i}" aria-current="${i === st.step}"><b>STEP ${i + 1}</b><span>${x.label}</span><i></i></button>`).join('')}<button class="btn" aria-label="단계 추가">+</button></div>`;
    $('#foot').querySelectorAll('[data-step]').forEach((b) => (b.onclick = () => { st.step = +b.dataset.step; st.playing = false; render(); }));
    $('#play').onclick = togglePlay; return;
  }
  $('#foot').innerHTML = `<div class="status"><span class="mono">${SM.TEAM.mode} · ${s.formation}</span><span>드래그 이동 · 방향키 1칸 · Shift+방향키 5칸 · Esc 선택 해제</span><span class="mono" style="margin-left:auto">자동 저장됨 14:32</span></div>`;
}

function insp() {
  const s = SM.squads[st.squad];
  if (st.app === 'strategy') {
    const m = SM.match;
    $('#insp').innerHTML = `<div class="sheet-handle"></div><div class="sec"><h4>경기 정보</h4><dl class="kv"><dt>상대</dt><dd><input class="inputx" value="${m.opponent}" aria-label="상대 팀"></dd><dt>일시</dt><dd><input class="inputx" value="${m.date}" aria-label="일시"></dd><dt>장소</dt><dd><input class="inputx" value="${m.venue}" aria-label="장소"></dd></dl></div>
      <div class="sec"><h4>감독 메모</h4><textarea class="field" aria-label="감독 메모">${m.memo}</textarea></div>
      <div class="sec"><h4>지침서 미리보기 <button class="btn" id="copyB">복사</button></h4><pre class="brief">${SM.shareText(st.squad)}</pre></div>`;
    $('#copyB').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '지침서를 복사했어요' : '복사가 막혀 있어요. 텍스트를 직접 선택해 주세요');
    return;
  }
  if (st.app === 'pattern') {
    const arr = SM.arrows(st.step);
    $('#insp').innerHTML = `<div class="sheet-handle"></div><div class="sec"><h4>패턴</h4><input class="inputx" value="${SM.pattern.name}" aria-label="패턴 이름"></div>
      <div class="sec"><h4>STEP ${st.step + 1} 경로 <span class="mono">${arr.length}</span></h4>${arr.map((a) => `<div class="prow" style="cursor:default"><span class="mono" style="color:${a.kind === 'run' ? 'var(--run)' : 'var(--pass)'}">${a.kind === 'run' ? '→' : '⇢'}</span><span>${a.kind === 'run' ? `${P(a.id).num} ${P(a.id).name} 이동` : '패스'}</span><span class="mono st">${fmt(a.to)}</span></div>`).join('')}</div>
      <div class="sec"><h4>단계 설명</h4><textarea class="field" aria-label="단계 설명">${SM.pattern.steps[st.step].label}</textarea></div>`;
    return;
  }
  const p = P(st.sel);
  const done = SM.PLAYERS.filter((x) => s.notes[x.id]).length;
  const playerSec = p ? `<div class="sec" style="--c:${p.color}"><h4>선수 <button class="btn" id="clr" aria-label="선택 해제">Esc</button></h4>
      <div class="big"><span class="num">${p.num}</span>${p.name}</div>
      <dl class="kv"><dt>역할</dt><dd>${SM.roleFor(s.formation, p.id)}</dd><dt>위치</dt><dd class="mono">${fmt(s.pos[p.id])}</dd><dt>색상</dt><dd><div class="sw">${COLORS.map((c) => `<button style="--c:${c}" data-c="${c}" aria-label="색상 ${c}" aria-pressed="${c === p.color}"></button>`).join('')}</div></dd></dl>
      <label for="pNote" class="lbl" style="font-size:12px;color:var(--sub)">개별 지침 · ${SM.SQUAD_LABEL[st.squad]} 스쿼드</label><textarea class="field" id="pNote" placeholder="${p.name}에게만 전할 지침">${s.notes[p.id] || ''}</textarea>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn">선수 시점 보기</button><button class="btn" id="del">명단에서 빼기</button></div></div>` : '';
  $('#insp').innerHTML = `<div class="sheet-handle"></div>${playerSec}
    <div class="sec"><h4>팀 전체 지침</h4><textarea class="field" id="tNote" aria-label="팀 전체 지침">${s.teamNote}</textarea></div>
    <div class="sec"><h4>개별 지침 <span class="mono">${done}/${SM.PLAYERS.length}</span></h4><div class="meter"><i style="width:${done / SM.PLAYERS.length * 100}%"></i></div>
      <div class="plist">${SM.PLAYERS.map((x) => `<button class="prow" data-pid="${x.id}"><span class="mono">${x.num}</span><span>${x.name}</span><span class="st${s.notes[x.id] ? ' ok' : ''}">${s.notes[x.id] ? '작성됨' : '—'}</span></button>`).join('')}</div></div>
    <div class="sec"><h4>단축키</h4><div class="short"><span>스쿼드 전환</span><span class="kbd">1 2 3</span><span>선수 위치 미세 이동</span><span class="kbd">← ↑ → ↓</span><span>되돌리기</span><span class="kbd">⌘Z</span></div></div>`;
  $('#tNote').oninput = (e) => (s.teamNote = e.target.value);
  $('#insp').querySelectorAll('[data-pid]').forEach((b) => (b.onclick = () => { st.sel = +b.dataset.pid; render(); }));
  if (p) {
    $('#pNote').oninput = (e) => (s.notes[p.id] = e.target.value);
    $('#clr').onclick = () => { st.sel = null; render(); };
    $('#insp').querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { const prev = p.color; p.color = b.dataset.c; undo = () => (p.color = prev); render(); toast(`${p.name} 색상 변경`, true); }));
    $('#del').onclick = () => toast(`${p.name}을(를) 명단에서 뺐어요`, true);
  }
}

let raf;
function togglePlay() {
  st.playing = !st.playing; $('#play').textContent = st.playing ? '정지' : '▶ 재생';
  if (!st.playing) { cancelAnimationFrame(raf); render(); return; }
  overlay(null); const dur = SM.reduced() ? 1 : 1000, n = SM.pattern.steps.length; let t0 = null;
  const bars = [...document.querySelectorAll('.tl-step i')];
  const tick = (ts) => {
    if (!st.playing) return; t0 ??= ts; const el = (ts - t0) / dur; const s = Math.floor(el) % (n + 1);
    const f = s < n ? SM.frame(s, el % 1) : SM.frame(n - 1, 1); nodes(f.pos, f.ball);
    bars.forEach((b, i) => (b.style.width = (i < s ? 100 : i === s ? (el % 1) * 100 : 0) + '%'));
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function render() {
  side(); tools(); foot(); insp();
  if (st.app === 'pattern') { const f = SM.frame(st.step, 0); nodes(f.pos, f.ball); overlay(st.step); }
  else { nodes(SM.squads[st.squad].pos); overlay(null); }
}

document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); doUndo(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); toast('명령 검색은 시안에서 표시만 해요'); return; }
  if (typing) return;
  if (['1', '2', '3'].includes(e.key)) go(views[+e.key - 1]);
  if (e.key === 'Escape') { st.sel = null; render(); }
  const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (d && st.sel && st.app === 'squad') {
    e.preventDefault(); const k = e.shiftKey ? 5 : 1; const pos = SM.squads[st.squad].pos; const q = pos[st.sel];
    pos[st.sel] = { x: Math.max(3, Math.min(97, q.x + d[0] * k)), y: Math.max(3, Math.min(97, q.y + d[1] * k)) }; render();
  }
});
$('#shareBtn').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '공유 텍스트를 복사했어요' : '복사가 막혀 있어요');
$('#cmdBtn').onclick = () => toast('명령 검색은 시안에서 표시만 해요');
$('#themeBtn').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark ? 'light' : 'dark'; };
render();
</script>

</body>
