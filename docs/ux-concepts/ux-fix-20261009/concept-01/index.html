<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>편집 데스크 | 스쿼드 메이커</title><link rel="stylesheet" href="../public/common.css"><style>
.workspace{grid-template-columns:220px minmax(360px,1fr) 340px}.library{display:grid;align-content:start;gap:20px}.library .file{padding:16px;background:var(--surface2);border-radius:10px}.library .file strong{display:block;margin-bottom:6px}.settings{align-self:start}.pitch-pane{padding:0 12px}.selection{border-top:1px solid var(--border);padding-top:18px}.context{display:flex;justify-content:space-between;width:100%;max-width:510px;padding:0 4px}.desktop-help{width:100%;max-width:510px}
@media(max-width:1350px){.workspace{grid-template-columns:minmax(360px,1fr) 340px;max-width:1150px}.library{display:none}}
@media(max-width:700px){.workspace{grid-template-columns:1fr}.pitch-pane{padding:0}.settings{display:grid;grid-template-columns:1fr;gap:20px}.context{display:none}.desktop-help{display:none}.selection{grid-row:1;border-top:0;padding-top:0}.settings>.team{grid-row:2;border-top:1px solid var(--border);padding-top:20px}.pitch-toolbar{max-width:420px}}
@media(orientation:landscape) and (max-height:600px){.workspace{grid-template-columns:minmax(0,1fr) 276px}.settings{display:block;max-height:calc(100dvh - 80px);overflow:auto}.settings>.team,.library,.context,.desktop-help,.settings>.notes{display:none}.selection{border:0;padding:0}.pitch-pane{padding:0}.pitch-toolbar{height:44px}.settings .selection-title{margin-bottom:6px}.settings .tools{margin-top:8px}.settings .stack{gap:8px}.settings label{gap:2px}.settings input{min-height:44px}.pitch{height:calc(100dvh - 126px)}}
</style></head><body data-concept="01">
<!-- THESIS: A stable desk makes the pitch and selected player's tools visible together.
OWN-WORLD: Existing NightPitch tokens, IBM Plex Sans KR, Oswald numbers, 10px controls and 16px panels.
STORY: Choose a player, change a position, adjust the team, then inspect a separated output header.
FIRST VIEWPORT: Library, portrait pitch and 340px settings on large desktop; pitch and 276px tools on landscape.
FORM: Approved concept 01, editing desk; deterministic prescribed structure.
FINISH: Browser evidence and finish review are delegated to the root verification session. -->
<header class="topbar"><a class="button back" href="../index.html">콘셉트 목록</a><div class="wordmark">SQUAD MAKER</div><div class="breadcrumb"><strong data-team-name>기본 팀</strong><span>기본 전술</span></div><button class="primary" data-result><span data-icon="image"></span>내보내기</button></header>
<main class="workspace">
<aside class="library panel"><h2>전술 목록</h2><div class="file"><strong>기본 전술</strong><p class="muted">8vs8 / 3-3-1</p></div><div><h3>선수</h3><div class="lineup" aria-label="선수 목록"></div></div></aside>
<section class="pitch-pane" aria-label="선수 배치"><div class="context"><h1>배치</h1><span class="muted">8명</span></div><div class="pitch-toolbar"><div class="segmented" aria-label="배치 상태"><button data-state="기본" aria-pressed="true">기본</button><button data-state="공격" aria-pressed="false">공격</button><button data-state="수비" aria-pressed="false">수비</button></div><span class="button" aria-label="포메이션 3-3-1">3-3-1</span></div><div class="pitch" aria-label="8vs8 축구 피치"></div><p class="muted desktop-help">선수 선택 후 도구로 이동하거나 방향키를 누르세요.</p></section>
<aside class="settings panel stack" aria-label="선수 도구와 팀 설정"><div class="team stack"><div class="app-navigation" aria-label="작업 화면"><span>배치</span><span>움직임 패턴</span><span>매치 전략</span></div><h2>팀 설정</h2><label>팀명<input id="teamName" value="기본 팀" maxlength="24"></label><p class="muted">8vs8 / 기본 전술</p></div><section class="selection stack" aria-label="선택한 선수 도구"><div class="selection-title"><span class="number" data-selected-number>7</span><div><h2 data-selected-name>미드3</h2><p class="muted"><span data-state-name>기본</span> 배치 편집</p></div></div><label>선수 이름<input id="playerName" value="미드3" maxlength="12" aria-describedby="nameCount"></label><span class="muted" id="nameCount">3/12</span><div class="tools"><button data-move="-3"><span data-icon="up"></span>위로</button><button data-move="3"><span data-icon="down"></span>아래로</button><button class="wide" id="playerColor">선수 색상 변경</button></div><p class="tool-status" role="status">선수를 선택하면 도구가 연결됩니다.</p></section><p class="notes subtle-rule">미드필더 간격을 유지하고, 공을 잃으면 가까운 선수가 먼저 압박합니다.</p></aside>
</main>
<dialog id="resultDialog" aria-labelledby="resultTitle"><div class="dialog-head"><h2 id="resultTitle">내보내기 결과물</h2><button id="closeResult" aria-label="닫기"><span data-icon="close"></span></button></div><img class="result-preview" id="resultPreview" alt="팀명 헤더와 피치가 분리된 스쿼드 결과물"><div class="dialog-actions"><button class="primary" id="downloadPng">PNG 다운로드</button></div><p class="export-status" id="exportStatus" role="status"></p></dialog>
<script src="../public/demo.js"></script></body></html>
