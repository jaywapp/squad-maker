<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피치 스튜디오 | 스쿼드 메이커</title><link rel="stylesheet" href="../public/common.css"><style>
.workspace{grid-template-columns:minmax(0,1fr) 320px;max-width:1500px}.pitch-pane{position:relative;background:var(--surface);border-radius:16px;padding:18px 80px}.pitch{max-width:min(650px,calc((100dvh - 180px)*.7273))}.pitch-toolbar{max-width:600px}.tool-rail{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:grid;gap:8px}.tool-rail button{width:48px;padding:10px;transition:transform 180ms cubic-bezier(.16,1,.3,1)}.settings{align-self:start}.settings .selection-title .number{font-size:44px}.selection{padding-top:20px;border-top:1px solid var(--border)}.settings-toggle{display:none}.pitch-caption{display:flex;justify-content:space-between;width:100%;max-width:600px}.pitch-caption h1{font-size:18px}.settings label{font-size:14px}.tool-rail button:hover{transform:translateX(3px)}.settings-open .team{animation:settings-in 200ms cubic-bezier(.16,1,.3,1)}.tool-status{min-height:42px}@keyframes settings-in{from{transform:translateY(6px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(max-width:700px){.workspace{grid-template-columns:1fr}.pitch-pane{padding:12px 12px 12px 60px}.tool-rail{left:7px}.pitch{max-width:360px}.pitch-toolbar{flex-wrap:wrap}.pitch-toolbar .formation{display:none}.pitch-caption{align-items:center}.pitch-caption .muted{display:none}.settings .team{display:none}.settings-open .settings .team{display:grid}.settings-toggle{display:inline-flex}.settings .selection-title .number{font-size:34px}.settings .selection{border:0;padding:0}.settings .lineup-wrap{display:none}}
@media(orientation:landscape) and (max-height:600px){.workspace{grid-template-columns:minmax(0,1fr) 248px;gap:10px}.pitch-pane{padding:0 52px;background:transparent}.pitch{max-width:none;height:calc(100dvh - 124px);max-height:300px}.pitch-toolbar{height:44px}.pitch-caption{display:none}.tool-rail{left:0}.settings{padding:12px;max-height:calc(100dvh - 80px);overflow:auto}.settings .selection{padding:0;border:0}.settings .team,.settings .lineup-wrap,.settings .notes{display:none}.settings-open .settings .team{display:grid}.settings-toggle{display:inline-flex;min-height:44px}.settings input{min-height:44px}.settings .selection-title .number{font-size:26px}.settings .stack{gap:8px}.settings .tool-status{min-height:20px}.settings .name-counter{display:none}}
</style></head><body data-concept="02">
<!-- THESIS: The pitch owns the canvas; a compact rail and persistent selection inspector serve it.
OWN-WORLD: NightPitch and existing face pairing; display numbers appear only in the player inspector.
STORY: Select directly on the pitch, nudge via the rail, expand team settings, inspect a caption below the output.
FIRST VIEWPORT: A large portrait pitch with left rail and 320px inspector; landscape retains a 248px inspector.
FORM: Approved concept 02, pitch studio; prescribed immersion structure.
FINISH: Browser evidence and finish review are delegated to the root verification session. -->
<header class="topbar"><a class="button back" href="../index.html">콘셉트 목록</a><div class="wordmark">SQUAD MAKER</div><div class="breadcrumb"><strong data-team-name>기본 팀</strong><span>기본 전술</span></div><button class="primary" data-result><span data-icon="image"></span>내보내기</button></header>
<main class="workspace"><section class="pitch-pane" aria-label="선수 배치"><div class="pitch-toolbar"><div class="segmented" aria-label="배치 상태"><button data-state="기본" aria-pressed="true">기본</button><button data-state="공격" aria-pressed="false">공격</button><button data-state="수비" aria-pressed="false">수비</button></div><span class="button formation">3-3-1</span></div><div class="pitch" aria-label="8vs8 축구 피치"></div><div class="tool-rail" aria-label="선수 위치 도구"><button data-move="-3" aria-label="선수 위로 이동"><span data-icon="up"></span></button><button data-move="3" aria-label="선수 아래로 이동"><span data-icon="down"></span></button></div><div class="pitch-caption"><h1>배치</h1><span class="muted">8vs8 / 3-3-1</span></div></section>
<aside class="settings panel stack" aria-label="선수 도구와 팀 설정"><div class="row"><h2>선수 편집</h2><button class="settings-toggle" data-settings aria-expanded="false" aria-controls="teamSettings">팀 설정</button></div><section class="selection stack"><div class="selection-title"><span class="number" data-selected-number>7</span><div><h2 data-selected-name>미드3</h2><p class="muted"><span data-state-name>기본</span> 배치 편집</p></div></div><label>선수 이름<input id="playerName" value="미드3" maxlength="12" aria-describedby="nameCount"></label><span class="muted name-counter" id="nameCount">3/12</span><button id="playerColor">선수 색상 변경</button><p class="tool-status" role="status">선수 선택 후 레일로 위치를 조정하세요.</p></section><div class="team stack subtle-rule" id="teamSettings"><h2>팀 설정</h2><label>팀명<input id="teamName" value="기본 팀" maxlength="24"></label><p class="muted">8vs8 / 기본 전술</p></div><div class="lineup-wrap subtle-rule"><h3>선수</h3><div class="lineup" aria-label="선수 목록"></div></div><p class="notes subtle-rule">미드필더 간격을 유지하고, 공을 잃으면 가까운 선수가 먼저 압박합니다.</p></aside></main>
<dialog id="resultDialog" aria-labelledby="resultTitle"><div class="dialog-head"><h2 id="resultTitle">내보내기 결과물</h2><button id="closeResult" aria-label="닫기"><span data-icon="close"></span></button></div><img class="result-preview" id="resultPreview" alt="팀명 캡션이 피치 아래에 분리된 스쿼드 결과물"><div class="dialog-actions"><button class="primary" id="downloadPng">PNG 다운로드</button></div><p class="export-status" id="exportStatus" role="status"></p></dialog>
<script src="../public/demo.js"></script></body></html>
