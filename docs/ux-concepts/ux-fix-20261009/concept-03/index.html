<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라인업 매치카드 | 스쿼드 메이커</title><link rel="stylesheet" href="../public/common.css"><style>
.workspace{grid-template-columns:minmax(0,1fr) 370px;max-width:1280px;gap:28px}.match-board{padding:0;overflow:hidden;align-self:start}.match-heading{padding:22px 26px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--border)}.match-heading h1{font-size:24px}.formation-number{font:600 42px/1.2 var(--num);color:var(--ink)}.match-meta{display:grid;gap:3px;margin-left:auto;text-align:right;font-size:14px;color:var(--ink2)}.pitch-pane{padding:18px 22px}.pitch-toolbar{max-width:510px}.lineup-panel{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lineup-panel .lineup{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}.lineup-panel h2{grid-column:1/-1}.lineup button{padding:7px 10px}.selection{transition:opacity 150ms}.selection-title .number{font-size:40px}.settings-toggle{display:none}.match-note{padding:16px 26px;border-top:1px solid var(--border);font-size:14px;color:var(--ink2)}.side-column{align-self:start;display:grid;gap:18px}.tools .wide{grid-column:auto}.player[aria-pressed=true] .circle{transition:transform 150ms}.player[aria-pressed=true]:hover .circle{transform:scale(1.06)}
@media(max-width:700px){.workspace{grid-template-columns:1fr;gap:14px}.match-heading{padding:16px;gap:16px}.match-heading h1{font-size:20px}.formation-number{font-size:32px}.match-meta{font-size:12px}.match-meta .date{display:none}.pitch-pane{padding:12px}.match-note{padding:14px 16px}.side-column{gap:14px}.side-column .selection{grid-row:1}.lineup-panel{display:none}.settings .team{display:none}.settings-open .settings .team{display:grid}.settings-toggle{display:inline-flex}.settings .selection-title .number{font-size:30px}}
@media(orientation:landscape) and (max-height:600px){.workspace{grid-template-columns:minmax(0,1fr) 264px;gap:12px}.match-heading{padding:6px 12px;min-height:44px;gap:14px}.match-heading h1{font-size:16px}.formation-number{font-size:24px}.match-meta{font-size:12px}.match-meta .date{display:none}.pitch-pane{padding:6px 8px;gap:6px}.pitch-toolbar{height:44px}.pitch{height:calc(100dvh - 190px);max-width:none}.match-note,.lineup-panel{display:none}.side-column{gap:8px;max-height:calc(100dvh - 80px);overflow:auto}.selection{padding:12px}.selection-title .number{font-size:26px}.selection.stack{gap:6px}.selection label{gap:2px}.selection input{min-height:44px}.selection .tools button{min-height:44px;padding:7px 10px;font-size:14px}.selection .tools .wide{grid-column:1/-1}.selection .name-counter{display:none}.settings{padding:10px 12px}.settings h2{display:none}.settings .team{display:none}.settings-open .settings .team{display:grid}.settings-toggle{display:inline-flex;min-height:44px}.settings .team h2{display:block}}
</style></head><body data-concept="03">
<!-- THESIS: A lineup card links the edited pitch with the image teammates will receive.
OWN-WORLD: NightPitch faces and colors, Oswald formation headline, standard 10px controls and 16px cards.
STORY: Read the team and formation, choose from pitch or lineup, adjust, then export a dated match card.
FIRST VIEWPORT: One match board plus a 370px lineup/editor column; landscape folds the lineup into tools.
FORM: Approved concept 03, lineup match card; prescribed editorial utility structure.
FINISH: Browser evidence and finish review are delegated to the root verification session. -->
<header class="topbar"><a class="button back" href="../index.html">콘셉트 목록</a><div class="wordmark">SQUAD MAKER</div><div class="breadcrumb"><strong>기본 전술</strong><span>라인업</span></div><button class="primary" data-result><span data-icon="image"></span>내보내기</button></header>
<main class="workspace"><section class="match-board panel" aria-label="라인업 매치카드"><header class="match-heading"><div><h1 data-team-name>기본 팀</h1><p class="muted">8vs8 / 기본 전술</p></div><span class="formation-number">3-3-1</span><div class="match-meta"><span class="date">2026.10.09</span><span data-state-name>기본</span></div></header><div class="pitch-pane"><div class="pitch-toolbar"><div class="segmented" aria-label="배치 상태"><button data-state="기본" aria-pressed="true">기본</button><button data-state="공격" aria-pressed="false">공격</button><button data-state="수비" aria-pressed="false">수비</button></div></div><div class="pitch" aria-label="8vs8 축구 피치"></div></div><p class="match-note">미드필더 간격을 유지하고, 공을 잃으면 가까운 선수가 먼저 압박합니다.</p></section>
<aside class="side-column" aria-label="라인업과 선수 도구"><section class="lineup-panel panel"><h2>라인업</h2><div class="lineup" aria-label="선수 목록"></div></section><section class="selection panel stack" aria-label="선택한 선수 도구"><div class="selection-title"><span class="number" data-selected-number>7</span><div><h2 data-selected-name>미드3</h2><p class="muted"><span data-state-name>기본</span> 배치 편집</p></div></div><label>선수 이름<input id="playerName" value="미드3" maxlength="12" aria-describedby="nameCount"></label><span class="muted name-counter" id="nameCount">3/12</span><div class="tools"><button data-move="-3"><span data-icon="up"></span>위로</button><button data-move="3"><span data-icon="down"></span>아래로</button><button class="wide" id="playerColor">선수 색상 변경</button></div><p class="tool-status" role="status">피치 또는 라인업에서 선수를 선택하세요.</p></section><section class="settings panel"><button class="settings-toggle" data-settings aria-expanded="false" aria-controls="teamSettings">팀 설정</button><div class="team stack" id="teamSettings"><h2>팀 설정</h2><label>팀명<input id="teamName" value="기본 팀" maxlength="24"></label></div></section></aside></main>
<dialog id="resultDialog" aria-labelledby="resultTitle"><div class="dialog-head"><h2 id="resultTitle">내보내기 결과물</h2><button id="closeResult" aria-label="닫기"><span data-icon="close"></span></button></div><img class="result-preview" id="resultPreview" alt="팀명과 포메이션과 날짜가 피치 위 경기 카드에 있는 스쿼드 결과물"><div class="dialog-actions"><button class="primary" id="downloadPng">PNG 다운로드</button></div><p class="export-status" id="exportStatus" role="status"></p></dialog>
<script src="../public/demo.js"></script></body></html>
