<title>스쿼드 메이커 프레스티지</title>
<style>
/*@FONT@*/
/* Layout: premium dark. Formation hero → night pitch → player-card carousel → glass cards; floating glass nav.
   Deliberately single dark theme (night-stadium look on any host background). ≥960px: pitch left, cards right. */
:root {
  --bg: #07090d;
  --bg-2: #0d1118;
  --glass: rgba(255,255,255,.045);
  --glass-2: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.09);
  --ink: #f4f1ea;
  --sub: #9aa0ab;
  --gold: #e6c27a;          /* 샴페인 골드 */
  --gold-2: #b8893e;
  --teal: #5fd4c4;
  --pitch-a: #0f2b24; --pitch-b: #0a1d19;
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; padding-inline: 16px; padding-block: 0 120px; min-height: 100vh;
  background: radial-gradient(90% 50% at 85% -5%, rgba(95,212,196,.13), transparent 60%), radial-gradient(80% 45% at 0% 10%, rgba(230,194,122,.10), transparent 60%), var(--bg); background-attachment: fixed; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ico { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.goldtxt { background: linear-gradient(180deg, #fff3d6 0%, var(--gold) 45%, var(--gold-2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

.wrap { max-width: 1100px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 10px; padding-block: 14px 6px; }
.mark { font-size: 12px; font-weight: 700; letter-spacing: .32em; color: var(--sub); }
.mark b { color: var(--gold); font-weight: 800; }
.top .grow { flex: 1; }
.gbtn { width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.gbtn:active { transform: scale(.94); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; min-width: 0; }
@media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 28px; } .col.left { position: sticky; top: 16px; } }

.hero { padding-top: 6px; }
.hero .lab { font-size: 13px; color: var(--sub); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.hero .lab i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.hero h1 { margin: 2px 0 0; font-size: clamp(56px, 17vw, 84px); line-height: .95; font-weight: 800; letter-spacing: -0.05em; }
.hero .meta { margin-top: 10px; font-size: 14px; color: var(--sub); }
.hero .meta b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 22px; margin-top: 18px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--sub); position: relative; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius: 2px; }
.forms { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 14px; }
.forms::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 32px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); font-size: 13.5px; font-weight: 600; color: var(--sub); }
.fchip[aria-pressed="true"] { color: #1a1407; background: linear-gradient(180deg, #f3dba4, var(--gold)); border-color: transparent; }

/* Pitch */
.pitchbox { position: relative; border-radius: 24px; padding: 1px; background: linear-gradient(160deg, rgba(230,194,122,.45), rgba(255,255,255,.06) 30%, rgba(95,212,196,.25)); box-shadow: 0 30px 60px rgba(0,0,0,.5); }
.pitch { position: relative; aspect-ratio: 68 / 94; border-radius: 23px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(70% 45% at 50% 50%, rgba(95,212,196,.10), transparent 70%), repeating-linear-gradient(180deg, var(--pitch-a) 0 8.33%, var(--pitch-b) 8.33% 16.66%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: rgba(230,240,235,.16); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.pitch svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.run { fill: none; stroke: var(--gold); stroke-width: 2.4; stroke-dasharray: 2 6; stroke-linecap: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 4px rgba(230,194,122,.7)); }
.pass { fill: none; stroke: var(--teal); stroke-width: 2.4; stroke-linecap: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 4px rgba(95,212,196,.8)); }
.tk { position: absolute; z-index: 2; width: 70px; margin-left: -35px; margin-top: -21px; display: grid; justify-items: center; gap: 5px; border: 0; background: none; padding: 0; touch-action: none; }
.tk .ring { width: 42px; height: 42px; border-radius: 50%; padding: 2px; background: conic-gradient(from 210deg, #fff1cc, var(--gold), var(--gold-2), #fff1cc); box-shadow: 0 6px 16px rgba(0,0,0,.5); transition: transform .3s cubic-bezier(.3,1.4,.5,1), box-shadow .3s; }
.tk.gk .ring { background: conic-gradient(from 210deg, #d6fff8, var(--teal), #2f8f84, #d6fff8); }
.tk .core { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #262c37, #0c0f15); display: grid; place-items: center; font-size: 16px; font-weight: 800; color: var(--ink); }
.tk .nm { font-size: 11.5px; font-weight: 600; color: rgba(244,241,234,.92); white-space: nowrap; padding: 1px 7px; border-radius: 6px; background: rgba(7,9,13,.55); }
.tk.sel .ring { transform: scale(1.12); box-shadow: 0 0 0 4px rgba(230,194,122,.18), 0 0 22px rgba(230,194,122,.55); }
.tk.dragging .ring { transform: scale(1.2); box-shadow: 0 0 26px rgba(230,194,122,.6), 0 14px 26px rgba(0,0,0,.6); }
.tk.dragging { z-index: 5; }
.tk .dot { position: absolute; top: -2px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); border: 2px solid var(--bg); }
.ball { position: absolute; z-index: 3; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.9); pointer-events: none; }
.pcap { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--sub); margin-top: 10px; padding-inline: 4px; }

/* Cards */
.sec-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.sec-h h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.sec-h .aside { margin-left: auto; font-size: 13px; color: var(--sub); }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 10px; }
.carousel::-webkit-scrollbar { display: none; }
@media (min-width: 960px) { .carousel { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; } }
.pc { flex: none; scroll-snap-align: start; width: 128px; height: 176px; border-radius: 18px; border: 1px solid rgba(230,194,122,.22); padding: 12px; text-align: left; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(155deg, rgba(230,194,122,.16), rgba(255,255,255,.02) 40%, rgba(95,212,196,.08)), var(--bg-2); transition: transform .2s; }
.pc:active { transform: scale(.97); }
.pc::before { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.08) 45%, transparent 60%); pointer-events: none; }
.pc .n { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
.pc .r { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--gold); margin-top: 4px; }
.pc .nm { margin-top: auto; font-size: 16px; font-weight: 700; }
.pc .st { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.pc .st.ok { color: var(--teal); }
.pc.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(230,194,122,.25); }

.glass { border-radius: 22px; border: 1px solid var(--line); background: var(--glass); padding: 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); min-width: 0; }
.quote { width: 100%; border: 0; background: transparent; resize: none; font-size: 17px; line-height: 1.6; font-weight: 500; min-height: 88px; padding: 0; color: var(--ink); }
.quote:focus { outline: none; }
.glass:focus-within { border-color: rgba(230,194,122,.5); }
.meter { display: flex; gap: 4px; margin-top: 4px; }
.meter i { flex: 1; height: 4px; border-radius: 2px; background: var(--glass-2); }
.meter i.on { background: linear-gradient(90deg, var(--gold), var(--gold-2)); }

/* Pattern */
.pathead { display: flex; align-items: center; gap: 10px; }
.pathead .t { flex: 1; min-width: 0; }
.pathead .t b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; }
.pathead .t span { font-size: 13px; color: var(--sub); }
.scrub { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sn { border: 0; background: none; text-align: left; padding: 12px 0 0; position: relative; color: var(--sub); }
.sn::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 2px; background: var(--glass-2); }
.sn i { position: absolute; left: 0; top: 0; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--gold), var(--teal)); width: 0; }
.sn[aria-current="true"] { color: var(--ink); }
.sn[aria-current="true"] i { width: 100%; }
.sn b { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--gold); }
.sn span { display: block; font-size: 13.5px; line-height: 1.4; margin-top: 2px; }
.cta { height: 54px; border-radius: 16px; border: 0; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: #1a1407; background: linear-gradient(180deg, #f6e2b3, var(--gold) 55%, var(--gold-2)); box-shadow: 0 10px 30px rgba(230,194,122,.25), inset 0 1px 0 rgba(255,255,255,.6); }
.cta.ghost { background: var(--glass); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.cta:active { transform: scale(.98); }
.ctarow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Match */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 6px; }
.vs .tm { display: grid; justify-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.vs .crest { width: 64px; height: 72px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
.vs .mid { font-size: 13px; font-weight: 800; letter-spacing: .3em; color: var(--sub); }
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.count div { border-radius: 14px; background: rgba(0,0,0,.25); border: 1px solid var(--line); padding: 10px 0; text-align: center; }
.count b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.count span { font-size: 11px; color: var(--sub); letter-spacing: .1em; }
.kv { display: grid; gap: 14px; }
.kv div { display: flex; align-items: center; gap: 12px; font-size: 15px; }
.kv .ico { color: var(--gold); }
pre.brief { margin: 0; white-space: pre-wrap; font-family: var(--font); font-size: 14px; line-height: 1.65; color: rgba(244,241,234,.9); }

/* Nav */
.nav { position: fixed; z-index: 30; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 22px; border: 1px solid var(--line); background: rgba(16,20,28,.72); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 20px 40px rgba(0,0,0,.5); }
.nb { height: 50px; min-width: 50px; border-radius: 16px; border: 0; background: none; color: var(--sub); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-weight: 700; font-size: 14px; transition: background .25s, color .25s; }
.nb span { display: none; white-space: nowrap; }
.nb[aria-selected="true"] { background: linear-gradient(180deg, rgba(230,194,122,.22), rgba(230,194,122,.08)); color: var(--gold); padding: 0 18px; }
.nb[aria-selected="true"] span { display: inline; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(520px, 100%); transform: translate(-50%, 105%); visibility: hidden; border-radius: 28px 28px 0 0; border: 1px solid var(--line); border-bottom: 0; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto;
  background: linear-gradient(180deg, rgba(230,194,122,.08), transparent 120px), #10141b; transition: transform .42s cubic-bezier(.2,1,.3,1), visibility 0s linear .42s; }
.sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform .42s cubic-bezier(.2,1,.3,1); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--glass-2); margin: 0 auto 16px; }
.ph { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; margin-bottom: 20px; }
.ph .n { font-size: 56px; font-weight: 800; line-height: .9; letter-spacing: -0.05em; }
.ph b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.ph span { font-size: 13px; color: var(--sub); }
.fl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--gold); margin-bottom: 8px; }
.area { width: 100%; border-radius: 16px; border: 1px solid var(--line); background: rgba(0,0,0,.25); padding: 14px; min-height: 96px; resize: none; line-height: 1.6; font-size: 15px; }
.area:focus { outline: none; border-color: rgba(230,194,122,.6); }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.ab { border-radius: 14px; border: 1px solid var(--line); background: var(--glass); padding: 12px 6px; display: grid; justify-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.ab.warn { color: #ff8a80; }
.toast { position: fixed; z-index: 60; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(230,194,122,.35); background: rgba(16,20,28,.92); color: var(--ink); font-weight: 600; font-size: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.5); white-space: nowrap; animation: tin .35s cubic-bezier(.2,1,.3,1); }
.toast .ico { color: var(--gold); }
@keyframes tin { from { opacity: 0; transform: translate(-50%, -10px); } }
.rise > * { animation: rise .5s cubic-bezier(.2,1,.3,1) both; }
.rise > *:nth-child(2) { animation-delay: .05s; } .rise > *:nth-child(3) { animation-delay: .1s; } .rise > *:nth-child(4) { animation-delay: .15s; }
@keyframes rise { from { transform: translateY(10px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header class="top"><span class="mark">SQUAD <b>MAKER</b></span><span class="grow"></span><button class="gbtn" id="shareBtn" type="button" aria-label="공유"></button></header>
  <div class="layout" id="view"></div>
</div>
<nav class="nav" role="tablist" aria-label="메뉴" id="nav"></nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="상세"></section>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/*@CORE@*/
</script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const I = SM.icon;
const st = { tab: 'lineup', squad: 'basic', sel: null, step: 0, playing: false };
const P = (id) => SM.PLAYERS.find((p) => p.id === +id);
$('#shareBtn').innerHTML = I('share', 20);
let tT;
function toast(msg, ic = 'check') { const t = $('#toast'); t.innerHTML = I(ic, 16) + msg; t.hidden = false; t.style.animation = 'none'; t.offsetWidth; t.style.animation = ''; clearTimeout(tT); tT = setTimeout(() => (t.hidden = true), 2000); }

const NAV = [['lineup', 'shirt', '라인업'], ['pattern', 'route', '전술'], ['match', 'calendar', '경기']];
function nav() {
  $('#nav').innerHTML = NAV.map(([k, ic, l]) => `<button class="nb" role="tab" aria-selected="${st.tab === k}" aria-label="${l}" data-tab="${k}">${I(ic, 22)}<span>${l}</span></button>`).join('');
  $('#nav').querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { stop(); st.tab = b.dataset.tab; render(true); scrollTo({ top: 0, behavior: 'smooth' }); }));
}

const pitch = () => `<div class="pitchbox"><div class="pitch" id="pitch"><svg class="lines" viewBox="0 0 68 94" preserveAspectRatio="none" aria-hidden="true"><rect x="3" y="3" width="62" height="88" rx="1"/><line x1="3" y1="47" x2="65" y2="47"/><circle cx="34" cy="47" r="8"/><rect x="16" y="3" width="36" height="13"/><rect x="25" y="3" width="18" height="5"/><rect x="16" y="78" width="36" height="13"/><rect x="25" y="86" width="18" height="5"/></svg><svg class="ov" id="ov" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div></div>`;

function viewLineup() {
  const s = SM.squads[st.squad];
  const done = SM.PLAYERS.filter((p) => s.notes[p.id]).length;
  const left = `<section class="hero"><div class="lab"><i></i>${SM.SQUAD_LABEL[st.squad]} 스쿼드 · 9인제</div><h1 class="goldtxt num">${s.formation}</h1><div class="meta"><b>${SM.TEAM.name}</b> · 다음 경기 vs ${SM.match.opponent}</div>
    <div class="tabs" role="tablist" aria-label="스쿼드">${Object.keys(SM.SQUAD_LABEL).map((k) => `<button role="tab" aria-selected="${k === st.squad}" data-sq="${k}">${SM.SQUAD_LABEL[k]}</button>`).join('')}</div>
    <div class="forms" role="group" aria-label="포메이션">${SM.FORMATIONS.map((f) => `<button class="fchip num" aria-pressed="${f === s.formation}" data-f="${f}">${f}</button>`).join('')}</div></section>
    <section>${pitch()}<div class="pcap"><span>선수를 끌어서 배치 · 눌러서 지침 작성</span><span>● 지침 있음</span></div></section>`;
  const right = `<section><div class="sec-h"><h2>선수 카드</h2><span class="aside num">지침 ${done}/${SM.PLAYERS.length}</span></div>
    <div class="carousel">${SM.PLAYERS.map((p) => `<button class="pc${st.sel === p.id ? ' sel' : ''}" data-pid="${p.id}"><span class="n goldtxt num">${p.num}</span><span class="r">${SM.roleFor(s.formation, p.id)}</span><span class="nm">${p.name}</span><span class="st${s.notes[p.id] ? ' ok' : ''}">${s.notes[p.id] ? I('check', 13, 3) + '지침 있음' : I('plus', 13, 2.5) + '지침 추가'}</span></button>`).join('')}</div></section>
    <section class="glass"><div class="sec-h"><h2>팀 전체 지침</h2><span class="aside">${SM.SQUAD_LABEL[st.squad]} 스쿼드</span></div><textarea class="quote" id="teamNote" aria-label="팀 전체 지침">${s.teamNote}</textarea></section>
    <section class="glass"><div class="sec-h"><h2>작성 현황</h2><span class="aside num">${Math.round((done / 9) * 100)}%</span></div><div class="meter">${SM.PLAYERS.map((p) => `<i class="${s.notes[p.id] ? 'on' : ''}"></i>`).join('')}</div></section>`;
  $('#view').innerHTML = `<div class="col left rise">${left}</div><div class="col rise">${right}</div>`;
  $('#view').querySelectorAll('[data-sq]').forEach((b) => (b.onclick = () => { st.squad = b.dataset.sq; render(); }));
  $('#view').querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { if (b.dataset.f === s.formation) return; s.formation = b.dataset.f; s.pos = SM.layout(s.formation); render(); toast(`${s.formation} 적용`); }));
  $('#view').querySelectorAll('[data-pid]').forEach((b) => (b.onclick = () => openPlayer(+b.dataset.pid)));
  $('#teamNote').oninput = (e) => (s.teamNote = e.target.value);
  tokens(s.pos, null, true);
}

function viewPattern() {
  const steps = SM.pattern.steps;
  const left = `<section class="pathead"><button class="gbtn" aria-label="이전 패턴">${I('chevL', 20)}</button><div class="t"><b>${SM.pattern.name}</b><span>PLAY 01 / 03 · ${steps.length}단계</span></div><button class="gbtn" aria-label="다음 패턴">${I('chevR', 20)}</button></section>
    <section>${pitch()}<div class="pcap"><span><b style="color:var(--gold)">┅</b> 선수 이동 · <b style="color:var(--teal)">━</b> 패스</span><span>화살표를 누르면 삭제</span></div></section>`;
  const right = `<section class="glass"><div class="scrub">${steps.map((x, i) => `<button class="sn" data-step="${i}" aria-current="${i === st.step}"><i></i><b>STEP ${i + 1}</b><span>${x.label}</span></button>`).join('')}</div></section>
    <button class="cta" id="play">${I(st.playing ? 'pause' : 'play', 18)}${st.playing ? '정지' : '전체 재생'}</button>
    <div class="ctarow"><button class="cta ghost" id="addStep">${I('plus', 18)}단계 추가</button><button class="cta ghost" id="gif">${I('download', 18)}GIF 저장</button></div>`;
  $('#view').innerHTML = `<div class="col left rise">${left}</div><div class="col rise">${right}</div>`;
  $('#view').querySelectorAll('[data-step]').forEach((b) => (b.onclick = () => { stop(); st.step = +b.dataset.step; render(); }));
  $('#play').onclick = () => (st.playing ? (stop(), render()) : play());
  $('#gif').onclick = () => toast('시안에서는 저장하지 않아요', 'download');
  $('#addStep').onclick = () => toast('시안에서는 단계를 추가하지 않아요', 'plus');
  const f = SM.frame(st.step, 0); tokens(f.pos, f.ball, false); arrows(st.step);
}

const crest = (a, b, t) => `<svg class="crest" viewBox="0 0 36 40" aria-hidden="true"><defs><linearGradient id="g${t}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs><path d="M18 1 34 6v13c0 10-7 16.5-16 20C9 35.5 2 29 2 19V6Z" fill="url(#g${t})" stroke="rgba(255,255,255,.35)" stroke-width=".8"/><text x="18" y="23" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Pretendard, sans-serif">${t}</text></svg>`;
let cdT;
function viewMatch() {
  const m = SM.match;
  const left = `<section class="glass"><div class="vs"><div class="tm">${crest('#0b2a66', '#3d7cf0', 'FC')}한강 유나이티드</div><div class="mid">VS</div><div class="tm">${crest('#5c0d18', '#e0505a', 'GS')}${m.opponent}</div></div>
    <div class="count num" id="count"></div></section>
    <section class="glass kv"><div>${I('calendar', 20)}${m.date}</div><div>${I('pin', 20)}${m.venue}</div><div>${I('clock', 20)}집합 08:30 · 전후반 25분</div></section>`;
  const right = `<section class="glass"><div class="sec-h"><h2>감독 메모</h2></div><textarea class="quote" aria-label="감독 메모">${m.memo}</textarea></section>
    <section class="glass"><div class="sec-h"><h2>전술 지침서</h2><span class="aside">${SM.SQUAD_LABEL[st.squad]} 스쿼드</span></div><pre class="brief">${SM.shareText(st.squad)}</pre></section>
    <button class="cta" id="copyB">${I('copy', 18)}지침서 복사</button>`;
  $('#view').innerHTML = `<div class="col left rise">${left}</div><div class="col rise">${right}</div>`;
  $('#copyB').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '지침서를 복사했어요' : '복사가 막혀 있어요', 'copy');
  const target = new Date('2026-10-12T09:00:00+09:00').getTime();
  const tick = () => {
    const el = $('#count'); if (!el) return clearInterval(cdT);
    let d = Math.max(0, target - Date.now()) / 1000; const D = Math.floor(d / 86400); d -= D * 86400; const H = Math.floor(d / 3600); d -= H * 3600; const M = Math.floor(d / 60); const S = Math.floor(d - M * 60);
    el.innerHTML = [[D, 'DAYS'], [H, 'HRS'], [M, 'MIN'], [S, 'SEC']].map(([v, l]) => `<div><b class="goldtxt">${String(v).padStart(2, '0')}</b><span>${l}</span></div>`).join('');
  };
  clearInterval(cdT); tick(); cdT = setInterval(tick, 1000);
}

const toPct = (cx, cy) => { const r = $('#pitch').getBoundingClientRect(); return { x: (cx - r.left) / r.width * 100, y: (cy - r.top) / r.height * 100 }; };
function tokens(pos, ball, editable) {
  const pt = $('#pitch'), s = SM.squads[st.squad];
  pt.querySelectorAll('.tk,.ball').forEach((n) => n.remove());
  SM.PLAYERS.forEach((p) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'tk' + (p.role === 'GK' ? ' gk' : '') + (st.sel === p.id ? ' sel' : '');
    b.style.left = pos[p.id].x + '%'; b.style.top = pos[p.id].y + '%';
    b.innerHTML = `<span class="ring"><span class="core num">${p.num}</span></span>${editable && s.notes[p.id] ? '<span class="dot"></span>' : ''}<span class="nm">${p.name}</span>`;
    b.setAttribute('aria-label', `${p.num}번 ${p.name}`);
    pt.appendChild(b);
    if (editable) SM.draggable(b, toPct, {
      onMove: (q) => { s.pos[p.id] = q; b.style.left = q.x + '%'; b.style.top = q.y + '%'; },
      onEnd: () => toast(`${p.name} 위치 이동`),
      onTap: () => openPlayer(p.id),
    }); else b.tabIndex = -1;
  });
  if (ball) { const e = document.createElement('div'); e.className = 'ball'; e.style.left = ball.x + '%'; e.style.top = ball.y + '%'; pt.appendChild(e); }
}
function arrows(step) {
  $('#ov').innerHTML = step == null ? '' : SM.arrows(step).map((a) => {
    const dx = a.to.x - a.from.x, dy = a.to.y - a.from.y, L = Math.hypot(dx, dy) || 1, k = 3.4 / L;
    const x1 = a.from.x + dx * k, y1 = a.from.y + dy * k, x2 = a.to.x - dx * k, y2 = a.to.y - dy * k;
    return `<line class="${a.kind}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#m${a.kind})"/>`;
  }).join('');
  if (step != null) $('#ov').insertAdjacentHTML('afterbegin', `<defs><marker id="mrun" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:var(--gold)"/></marker><marker id="mpass" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:var(--teal)"/></marker></defs>`);
}
let raf;
function stop() { st.playing = false; cancelAnimationFrame(raf); }
function play() {
  st.playing = true; const b = $('#play'); b.innerHTML = I('pause', 18) + '정지'; b.onclick = () => { stop(); render(); };
  arrows(null); const dur = SM.reduced() ? 1 : 1200, n = SM.pattern.steps.length; let t0 = null;
  const sns = [...document.querySelectorAll('.sn')];
  const tick = (ts) => {
    if (!st.playing) return; t0 ??= ts; const el = (ts - t0) / dur; const s = Math.floor(el) % (n + 1);
    const f = s < n ? SM.frame(s, el % 1) : SM.frame(n - 1, 1); tokens(f.pos, f.ball, false);
    sns.forEach((x, i) => { x.setAttribute('aria-current', i === s); x.querySelector('i').style.width = (i < s ? 100 : i === s ? (el % 1) * 100 : 0) + '%'; });
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

let lastFocus;
function openSheet(html, label) {
  lastFocus = document.activeElement;
  const sh = $('#sheet'), sc = $('#scrim'); sh.innerHTML = `<div class="grab"></div>${html}`; sh.setAttribute('aria-label', label);
  sc.hidden = false; requestAnimationFrame(() => { sc.classList.add('on'); sh.classList.add('on'); }); sc.onclick = closeSheet;
  setTimeout(() => (sh.querySelector('textarea, button') || sh).focus({ preventScroll: true }), 60);
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); setTimeout(() => ($('#scrim').hidden = true), 300);
  st.sel = null; if (st.tab === 'lineup') render(); lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}
function openPlayer(id) {
  const p = P(id), s = SM.squads[st.squad]; st.sel = id;
  document.querySelectorAll('.tk').forEach((n, i) => n.classList.toggle('sel', SM.PLAYERS[i].id === id));
  openSheet(`<div class="ph"><span class="n goldtxt num">${p.num}</span><div><b>${p.name}</b><span>${SM.roleFor(s.formation, p.id)} · ${SM.SQUAD_LABEL[st.squad]} 스쿼드</span></div><button class="gbtn" id="shClose" aria-label="닫기">${I('x', 20)}</button></div>
    <label class="fl" for="pNote">개별 지침</label><textarea class="area" id="pNote" placeholder="${p.name}에게만 전할 지침을 적어주세요">${s.notes[p.id] || ''}</textarea>
    <div class="acts"><button class="ab">${I('pencil', 20)}이름 변경</button><button class="ab">${I('eye', 20)}선수 시점</button><button class="ab warn">${I('trash', 20)}명단 제외</button></div>`, `${p.name} 상세`);
  $('#shClose').onclick = closeSheet;
  $('#pNote').oninput = (e) => (s.notes[p.id] = e.target.value);
}
$('#shareBtn').onclick = () => {
  openSheet(`<div class="ph" style="grid-template-columns:1fr auto"><div><b>공유하기</b><span>링크로 열면 읽기 전용으로 보여요</span></div><button class="gbtn" id="shClose" aria-label="닫기">${I('x', 20)}</button></div>
    <div class="glass" style="padding:14px"><pre class="brief">${SM.shareText(st.squad)}</pre></div>
    <div class="acts"><button class="ab" id="sCopy">${I('copy', 20)}텍스트 복사</button><button class="ab" id="sLink">${I('link', 20)}링크 복사</button><button class="ab" id="sImg">${I('image', 20)}이미지 저장</button></div>`, '공유하기');
  $('#shClose').onclick = closeSheet;
  $('#sCopy').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '공유 텍스트를 복사했어요' : '복사가 막혀 있어요', 'copy');
  $('#sLink').onclick = () => toast('시안에서는 링크를 만들지 않아요', 'link');
  $('#sImg').onclick = () => toast('시안에서는 저장하지 않아요', 'image');
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });

function render(anim) {
  nav();
  ({ lineup: viewLineup, pattern: viewPattern, match: viewMatch })[st.tab]();
  if (!anim) $('#view').querySelectorAll('.rise').forEach((n) => n.classList.remove('rise'));
}
render(true);
</script>
