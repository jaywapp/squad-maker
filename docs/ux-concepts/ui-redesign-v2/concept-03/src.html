<title>스쿼드 메이커 플레인</title>
<style>
/*@FONT@*/
/* Layout: minimal, one idea per section. Big conversational headline → flat pitch → gray band dividers → list rows;
   sticky full-width CTA at the bottom; choices open as list sheets. ≥960px: pitch left, sections right. */
:root {
  --bg: #ffffff;
  --band: #f2f4f6;          /* 섹션 구분 띠 */
  --fill: #f2f4f6;
  --ink: #191f28;
  --ink-2: #333d4b;
  --sub: #8b95a1;
  --hair: #e5e8eb;
  --blue: #2463eb;
  --blue-soft: #e8efff;
  --pitch: #eef1f4;
  --pitch-line: #ffffff;
  --dot: #2463eb;
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17171c; --band: #101013; --fill: #2c2c35; --ink: #f2f3f5; --ink-2: #d6d9de; --sub: #8b929e; --hair: #2c2c35; --blue: #4a86ff; --blue-soft: #1d2b4d; --pitch: #22222a; --pitch-line: #3a3a45; --dot: #4a86ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17171c; --band: #101013; --fill: #2c2c35; --ink: #f2f3f5; --ink-2: #d6d9de; --sub: #8b929e; --hair: #2c2c35; --blue: #4a86ff; --blue-soft: #1d2b4d; --pitch: #22222a; --pitch-line: #3a3a45; --dot: #4a86ff; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; padding-inline: 0; padding-block: 0 110px; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.ico { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.pad { padding-inline: 20px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-in { max-width: 1040px; margin: 0 auto; height: 52px; display: flex; align-items: center; gap: 4px; padding-inline: 20px; }
.top-in b { font-size: 17px; font-weight: 700; flex: 1; }
.ib { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; display: grid; place-items: center; color: var(--ink-2); }
.ib:active { background: var(--fill); }
.tabs { max-width: 1040px; margin: 0 auto; display: flex; gap: 20px; padding-inline: 20px; border-bottom: 1px solid var(--hair); }
.tab { border: 0; background: none; padding: 10px 0 12px; font-size: 16px; font-weight: 600; color: var(--sub); position: relative; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }

.wrap { max-width: 1040px; margin: 0 auto; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); }
.col { min-width: 0; }
@media (min-width: 960px) {
  .layout { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 40px; padding-inline: 20px; }
  .layout .pad { padding-inline: 0; }
  .col.left { position: sticky; top: 112px; align-self: start; }
  .band { display: none; }
  .col.right section + section { border-top: 1px solid var(--hair); }
}
.head { padding-block: 26px 20px; }
.head .over { font-size: 15px; color: var(--sub); font-weight: 500; }
.head h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.38; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.head h1 em { font-style: normal; color: var(--blue); }
.band { height: 12px; background: var(--band); }
section.sec { padding-block: 24px; }
.sec h2 { margin: 0 0 14px; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 8px; }
.sec h2 small { font-size: 15px; font-weight: 600; color: var(--blue); }

.pills { display: flex; gap: 8px; margin-bottom: 16px; }
.pill { height: 38px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--fill); color: var(--ink-2); font-size: 15px; font-weight: 600; transition: background .2s, color .2s, transform .12s; }
.pill:active { transform: scale(.96); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.pitch { position: relative; aspect-ratio: 68 / 88; border-radius: 20px; background: var(--pitch); touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: var(--pitch-line); stroke-width: 2; vector-effect: non-scaling-stroke; }
.pitch svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.run { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.pass { fill: none; stroke: var(--blue); stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.pd { position: absolute; z-index: 2; width: 64px; margin-left: -32px; margin-top: -17px; display: grid; justify-items: center; gap: 4px; border: 0; background: none; padding: 0; touch-action: none; }
.pd .c { width: 34px; height: 34px; border-radius: 50%; background: var(--dot); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; transition: transform .25s cubic-bezier(.3,1.4,.5,1), box-shadow .2s; }
.pd.gk .c { background: var(--ink); color: var(--bg); }
.pd .n { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.pd.sel .c { transform: scale(1.15); box-shadow: 0 0 0 5px var(--blue-soft); }
.pd.dragging { z-index: 5; } .pd.dragging .c { transform: scale(1.22); box-shadow: 0 8px 18px rgba(0,0,0,.18); }
.ball { position: absolute; z-index: 3; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--ink); pointer-events: none; }
.hint { margin: 12px 0 0; font-size: 14px; color: var(--sub); }

.list { display: grid; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 64px; padding: 10px 0; border: 0; background: none; text-align: left; border-radius: 12px; }
.li:active { background: var(--fill); }
.li .av { width: 40px; height: 40px; border-radius: 50%; background: var(--fill); color: var(--ink-2); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.li .av.on { background: var(--blue-soft); color: var(--blue); }
.li .tx b { display: block; font-size: 16px; font-weight: 600; color: var(--ink); }
.li .tx span { display: block; font-size: 14px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .rt { display: flex; align-items: center; gap: 4px; color: var(--sub); font-size: 15px; }
.li .rt b { color: var(--ink-2); font-weight: 600; }
.box { width: 100%; border: 0; background: var(--fill); border-radius: 14px; padding: 14px 16px; min-height: 96px; resize: none; font-size: 16px; line-height: 1.6; color: var(--ink); }
.box:focus { outline: 2px solid var(--blue); outline-offset: -2px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sp { width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; align-items: start; text-align: left; border: 0; background: none; padding: 12px 0; border-radius: 12px; }
.sp .k { width: 28px; height: 28px; border-radius: 50%; background: var(--fill); color: var(--sub); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.sp b { display: block; font-size: 16px; font-weight: 600; color: var(--sub); line-height: 1.4; padding-top: 3px; }
.sp[aria-current="true"] .k { background: var(--blue); color: #fff; }
.sp[aria-current="true"] b { color: var(--ink); }
.sp .bar { display: block; height: 3px; border-radius: 2px; background: var(--fill); margin-top: 8px; overflow: hidden; }
.sp .bar i { display: block; height: 100%; width: 0; background: var(--blue); }
.add { display: flex; align-items: center; gap: 14px; color: var(--blue); font-weight: 600; border: 0; background: none; padding: 12px 0; }
.add span { width: 28px; height: 28px; border-radius: 50%; background: var(--blue-soft); display: grid; place-items: center; }

pre.brief { margin: 0; white-space: pre-wrap; font-family: var(--font); font-size: 15px; line-height: 1.7; color: var(--ink-2); background: var(--fill); border-radius: 14px; padding: 16px; }

.cta-wrap { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; padding: 20px 20px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.cta-in { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
.cta { flex: 1; height: 56px; border-radius: 16px; border: 0; background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, filter .12s; }
.cta:active { transform: scale(.98); filter: brightness(.94); }
.cta.sub { flex: 0 0 auto; padding: 0 20px; background: var(--fill); color: var(--ink-2); }
@media (min-width: 960px) { .cta-in { max-width: 1000px; justify-content: flex-end; } .cta { flex: 0 0 auto; padding: 0 28px; } }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(520px, 100%); transform: translate(-50%, 105%); visibility: hidden; background: var(--bg); border-radius: 24px 24px 0 0; padding: 28px 20px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 90vh; overflow-y: auto; transition: transform .4s cubic-bezier(.2,1,.3,1), visibility 0s linear .4s; }
.sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform .4s cubic-bezier(.2,1,.3,1); }
.sheet h3 { margin: 0 0 6px; font-size: 22px; line-height: 1.4; font-weight: 700; letter-spacing: -0.03em; }
.sheet .sd { margin: 0 0 20px; font-size: 15px; color: var(--sub); }
.sheet .cta { width: 100%; margin-top: 16px; }
.opt { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; border: 0; background: none; font-size: 17px; font-weight: 500; text-align: left; border-radius: 12px; padding: 0 4px; }
.opt[aria-checked="true"] { color: var(--blue); font-weight: 700; }
.opt:active { background: var(--fill); }
.opt small { display: block; font-size: 14px; color: var(--sub); font-weight: 400; }
.sacts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.sa { border: 0; background: var(--fill); border-radius: 14px; padding: 14px 4px; display: grid; justify-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(480px, calc(100% - 40px)); display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-radius: 16px; background: rgba(32,36,44,.94); color: #fff; font-size: 15px; font-weight: 500; animation: tin .3s cubic-bezier(.2,1,.3,1); }
.toast .ok { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; flex: none; }
.toast button { margin-left: auto; border: 0; background: none; color: #9ec0ff; font-weight: 600; padding: 0; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 10px); } }
.enter { animation: enter .35s cubic-bezier(.2,1,.3,1); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="top">
  <div class="top-in"><b>스쿼드 메이커</b><button class="ib" id="themeBtn" type="button" aria-label="화면 테마 전환"></button><button class="ib" type="button" aria-label="더보기" id="moreBtn"></button></div>
  <nav class="tabs" role="tablist" aria-label="메뉴" id="tabs"></nav>
</header>
<main class="wrap"><div class="layout" id="view"></div></main>
<div class="cta-wrap"><div class="cta-in" id="cta"></div></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="상세"></section>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/*@CORE@*/
</script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const I = SM.icon;
const st = { tab: 'lineup', squad: 'basic', sel: null, step: 0, playing: false };
const P = (id) => SM.PLAYERS.find((p) => p.id === +id);
$('#moreBtn').innerHTML = I('more', 22);
const dark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
const themeIcon = () => ($('#themeBtn').innerHTML = dark() ? '<svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>');
themeIcon(); $('#themeBtn').onclick = () => { document.documentElement.dataset.theme = dark() ? 'light' : 'dark'; themeIcon(); };

let tT, undoFn;
function toast(msg, undo) {
  undoFn = undo; const t = $('#toast');
  t.innerHTML = `<span class="ok">${I('check', 14, 3)}</span><span>${msg}</span>${undo ? '<button type="button" id="undoBtn">되돌리기</button>' : ''}`;
  t.hidden = false; t.style.animation = 'none'; t.offsetWidth; t.style.animation = '';
  if (undo) $('#undoBtn').onclick = () => { undoFn(); t.hidden = true; render(); };
  clearTimeout(tT); tT = setTimeout(() => (t.hidden = true), undo ? 4500 : 2000);
}

const TABS = [['lineup', '라인업'], ['pattern', '전술 패턴'], ['match', '경기']];
function tabs() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${st.tab === k}" data-tab="${k}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { stop(); st.tab = b.dataset.tab; render(true); scrollTo({ top: 0 }); }));
}
const pitch = () => `<div class="pitch" id="pitch"><svg class="lines" viewBox="0 0 68 88" preserveAspectRatio="none" aria-hidden="true"><rect x="4" y="4" width="60" height="80" rx="2"/><line x1="4" y1="44" x2="64" y2="44"/><circle cx="34" cy="44" r="7"/><rect x="18" y="4" width="32" height="12"/><rect x="18" y="72" width="32" height="12"/></svg><svg class="ov" id="ov" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>`;
const band = '<div class="band"></div>';

function viewLineup() {
  const s = SM.squads[st.squad];
  const done = SM.PLAYERS.filter((p) => s.notes[p.id]).length;
  const left = `<div class="head pad"><div class="over">${SM.TEAM.name}</div><h1>${SM.SQUAD_LABEL[st.squad]} 스쿼드는<br><em class="num">${s.formation}</em>로 나가요</h1></div>
    <div class="pad"><div class="pills" role="tablist" aria-label="스쿼드">${Object.keys(SM.SQUAD_LABEL).map((k) => `<button class="pill" role="tab" aria-pressed="${k === st.squad}" data-sq="${k}">${SM.SQUAD_LABEL[k]}</button>`).join('')}</div>${pitch()}<p class="hint">선수를 끌어서 옮기고, 누르면 지침을 적을 수 있어요</p></div>`;
  const right = `${band}<section class="sec pad"><div class="list">
      <button class="li" id="formRow"><span class="av">${I('sliders', 20)}</span><span class="tx"><b>포메이션</b><span>바꾸면 기본 배치로 돌아가요</span></span><span class="rt"><b class="num">${s.formation}</b>${I('chevR', 18)}</span></button>
      <button class="li" id="modeRow"><span class="av">${I('users', 20)}</span><span class="tx"><b>경기 인원</b><span>필드 8명 + 골키퍼</span></span><span class="rt"><b>9인제</b>${I('chevR', 18)}</span></button></div></section>
    ${band}<section class="sec pad"><h2>팀 전체 지침</h2><textarea class="box" id="teamNote" aria-label="팀 전체 지침">${s.teamNote}</textarea></section>
    ${band}<section class="sec pad"><h2>선수별 지침 <small class="num">${done}/${SM.PLAYERS.length}</small></h2><div class="list">${SM.PLAYERS.map((p) => `<button class="li" data-pid="${p.id}"><span class="av num${s.notes[p.id] ? ' on' : ''}">${p.num}</span><span class="tx"><b>${p.name}</b><span>${s.notes[p.id] || '지침 적기'}</span></span><span class="rt">${SM.roleFor(s.formation, p.id)}${I('chevR', 18)}</span></button>`).join('')}</div></section>`;
  $('#view').innerHTML = `<div class="col left">${left}</div><div class="col right">${right}</div>`;
  $('#view').querySelectorAll('[data-sq]').forEach((b) => (b.onclick = () => { st.squad = b.dataset.sq; render(); }));
  $('#view').querySelectorAll('[data-pid]').forEach((b) => (b.onclick = () => openPlayer(+b.dataset.pid)));
  $('#formRow').onclick = openForm; $('#modeRow').onclick = openMode;
  $('#teamNote').oninput = (e) => (s.teamNote = e.target.value);
  $('#cta').innerHTML = `<button class="cta" id="shareCta">${I('share', 20)}단톡방에 공유하기</button>`;
  $('#shareCta').onclick = openShare;
  dots(s.pos, null, true);
}

function viewPattern() {
  const steps = SM.pattern.steps;
  const left = `<div class="head pad"><div class="over">전술 패턴 1/3</div><h1>${SM.pattern.name}</h1></div><div class="pad">${pitch()}<p class="hint">선수를 끌면 이동, 공을 끌면 패스 경로가 그려져요</p></div>`;
  const right = `${band}<section class="sec pad"><h2>순서</h2><ol class="steps">${steps.map((x, i) => `<li><button class="sp" data-step="${i}" aria-current="${i === st.step}"><span class="k num">${i + 1}</span><span><b>${x.label}</b><span class="bar"><i></i></span></span></button></li>`).join('')}</ol><button class="add"><span>${I('plus', 16, 2.5)}</span>단계 추가하기</button></section>
    ${band}<section class="sec pad"><div class="list"><button class="li"><span class="av">${I('route', 20)}</span><span class="tx"><b>다른 패턴 보기</b><span>전방 압박 트랩, 코너킥 니어 플릭</span></span><span class="rt">${I('chevR', 18)}</span></button><button class="li" id="gifRow"><span class="av">${I('download', 20)}</span><span class="tx"><b>GIF로 저장</b><span>단톡방에 바로 올릴 수 있어요</span></span><span class="rt">${I('chevR', 18)}</span></button></div></section>`;
  $('#view').innerHTML = `<div class="col left">${left}</div><div class="col right">${right}</div>`;
  $('#view').querySelectorAll('[data-step]').forEach((b) => (b.onclick = () => { stop(); st.step = +b.dataset.step; render(); }));
  $('#gifRow').onclick = () => toast('시안에서는 저장하지 않아요');
  $('#cta').innerHTML = `<button class="cta" id="play">${I(st.playing ? 'pause' : 'play', 20)}${st.playing ? '멈추기' : '처음부터 재생하기'}</button>`;
  $('#play').onclick = () => (st.playing ? (stop(), render()) : play());
  const f = SM.frame(st.step, 0); dots(f.pos, f.ball, false); arrows(st.step);
}

function viewMatch() {
  const m = SM.match;
  const left = `<div class="head pad"><div class="over">다음 경기 · D-7</div><h1>10월 12일 일요일,<br><em>${m.opponent}</em>와 경기해요</h1></div>
    <div class="pad"><div class="list"><div class="li"><span class="av">${I('clock', 20)}</span><span class="tx"><b>오전 9:00 킥오프</b><span>8:30까지 모여요 · 전후반 25분</span></span><span></span></div><div class="li"><span class="av">${I('pin', 20)}</span><span class="tx"><b>${m.venue}</b><span>인조잔디 · 주차 가능</span></span><span></span></div><div class="li"><span class="av">${I('users', 20)}</span><span class="tx"><b>9인제</b><span>참석 11명 · 교체 2명</span></span><span></span></div></div></div>`;
  const right = `${band}<section class="sec pad"><h2>감독 메모</h2><textarea class="box" aria-label="감독 메모">${m.memo}</textarea></section>
    ${band}<section class="sec pad"><h2>선수들에게 보낼 지침서</h2><pre class="brief">${SM.shareText(st.squad)}</pre></section>`;
  $('#view').innerHTML = `<div class="col left">${left}</div><div class="col right">${right}</div>`;
  $('#cta').innerHTML = `<button class="cta sub" id="txt">${I('file', 20)}</button><button class="cta" id="copyB">${I('copy', 20)}지침서 복사하기</button>`;
  $('#copyB').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '지침서를 복사했어요' : '복사가 막혀 있어요. 직접 선택해 주세요');
  $('#txt').setAttribute('aria-label', '텍스트 파일로 저장'); $('#txt').onclick = () => toast('시안에서는 저장하지 않아요');
}

const toPct = (cx, cy) => { const r = $('#pitch').getBoundingClientRect(); return { x: (cx - r.left) / r.width * 100, y: (cy - r.top) / r.height * 100 }; };
function dots(pos, ball, editable) {
  const pt = $('#pitch'), s = SM.squads[st.squad];
  pt.querySelectorAll('.pd,.ball').forEach((n) => n.remove());
  SM.PLAYERS.forEach((p) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'pd' + (p.role === 'GK' ? ' gk' : '') + (st.sel === p.id ? ' sel' : '');
    b.style.left = pos[p.id].x + '%'; b.style.top = pos[p.id].y + '%';
    b.innerHTML = `<span class="c num">${p.num}</span><span class="n">${p.name}</span>`; b.setAttribute('aria-label', `${p.num}번 ${p.name}`);
    pt.appendChild(b);
    if (editable) { let before; SM.draggable(b, toPct, {
      onMove: (q) => { before ??= { ...s.pos[p.id] }; s.pos[p.id] = q; b.style.left = q.x + '%'; b.style.top = q.y + '%'; },
      onEnd: () => { const prev = before; before = null; toast(`${p.name} 선수를 옮겼어요`, () => (s.pos[p.id] = prev)); },
      onTap: () => openPlayer(p.id),
    }); } else b.tabIndex = -1;
  });
  if (ball) { const e = document.createElement('div'); e.className = 'ball'; e.style.left = ball.x + '%'; e.style.top = ball.y + '%'; pt.appendChild(e); }
}
function arrows(step) {
  $('#ov').innerHTML = step == null ? '' : `<defs><marker id="mr" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:var(--ink-2)"/></marker><marker id="mp" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:var(--blue)"/></marker></defs>` +
    SM.arrows(step).map((a) => { const dx = a.to.x - a.from.x, dy = a.to.y - a.from.y, L = Math.hypot(dx, dy) || 1, k = 3 / L; return `<line class="${a.kind}" x1="${a.from.x + dx * k}" y1="${a.from.y + dy * k}" x2="${a.to.x - dx * k}" y2="${a.to.y - dy * k}" marker-end="url(#${a.kind === 'run' ? 'mr' : 'mp'})"/>`; }).join('');
}
let raf;
function stop() { st.playing = false; cancelAnimationFrame(raf); }
function play() {
  st.playing = true; const b = $('#play'); b.innerHTML = I('pause', 20) + '멈추기'; b.onclick = () => { stop(); render(); };
  arrows(null); const dur = SM.reduced() ? 1 : 1100, n = SM.pattern.steps.length; let t0 = null;
  const sps = [...document.querySelectorAll('.sp')];
  const tick = (ts) => {
    if (!st.playing) return; t0 ??= ts; const el = (ts - t0) / dur; const s = Math.floor(el) % (n + 1);
    const f = s < n ? SM.frame(s, el % 1) : SM.frame(n - 1, 1); dots(f.pos, f.ball, false);
    sps.forEach((x, i) => { x.setAttribute('aria-current', i === Math.min(s, n - 1)); x.querySelector('.bar i').style.width = (i < s ? 100 : i === s ? (el % 1) * 100 : 0) + '%'; });
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

let lastFocus;
function openSheet(html, label) {
  lastFocus = document.activeElement;
  const sh = $('#sheet'), sc = $('#scrim'); sh.innerHTML = html; sh.setAttribute('aria-label', label);
  sc.hidden = false; requestAnimationFrame(() => { sc.classList.add('on'); sh.classList.add('on'); }); sc.onclick = closeSheet;
  setTimeout(() => (sh.querySelector('textarea, button') || sh).focus({ preventScroll: true }), 60);
}
function closeSheet() {
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); setTimeout(() => ($('#scrim').hidden = true), 260);
  st.sel = null; if (st.tab === 'lineup') render(); lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}
function openPlayer(id) {
  const p = P(id), s = SM.squads[st.squad]; st.sel = id;
  document.querySelectorAll('.pd').forEach((n, i) => n.classList.toggle('sel', SM.PLAYERS[i].id === id));
  openSheet(`<h3>${p.num}번 ${p.name} 선수에게<br>전할 말을 적어주세요</h3><p class="sd">${SM.SQUAD_LABEL[st.squad]} 스쿼드 · ${SM.roleFor(s.formation, p.id)} · 이 선수에게만 보여요</p>
    <textarea class="box" id="pNote" aria-label="${p.name} 개별 지침" placeholder="예) 공격할 때 오른쪽 하프스페이스로 들어가기">${s.notes[p.id] || ''}</textarea>
    <div class="list" style="margin-top:8px"><button class="li"><span class="av">${I('eye', 20)}</span><span class="tx"><b>선수 시점으로 보기</b></span><span class="rt">${I('chevR', 18)}</span></button><button class="li"><span class="av">${I('pencil', 20)}</span><span class="tx"><b>이름 바꾸기</b></span><span class="rt">${I('chevR', 18)}</span></button><button class="li" id="rm"><span class="av">${I('trash', 20)}</span><span class="tx"><b>명단에서 빼기</b></span><span class="rt">${I('chevR', 18)}</span></button></div>
    <button class="cta" id="save">저장하기</button>`, `${p.name} 지침`);
  const ta = $('#pNote');
  $('#save').onclick = () => { s.notes[p.id] = ta.value.trim(); closeSheet(); toast(`${p.name} 선수 지침을 저장했어요`); };
  $('#rm').onclick = () => { closeSheet(); toast(`${p.name} 선수를 명단에서 뺐어요`, () => {}); };
}
function openForm() {
  const s = SM.squads[st.squad];
  openSheet(`<h3>포메이션을 골라주세요</h3><p class="sd">바꾸면 선수 배치가 기본 위치로 돌아가요</p><div role="radiogroup">${SM.FORMATIONS.map((f) => `<button class="opt num" role="radio" aria-checked="${f === s.formation}" data-f="${f}">${f}${f === s.formation ? `<span style="color:var(--blue)">${I('check', 22, 2.6)}</span>` : ''}</button>`).join('')}</div>`, '포메이션 선택');
  $('#sheet').querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => {
    const prev = { f: s.formation, pos: s.pos }; if (b.dataset.f === prev.f) return closeSheet();
    s.formation = b.dataset.f; s.pos = SM.layout(s.formation); closeSheet(); toast(`${s.formation}로 바꿨어요`, () => { s.formation = prev.f; s.pos = prev.pos; });
  }));
}
function openMode() {
  openSheet(`<h3>몇 명이서 경기하나요?</h3><p class="sd">골키퍼를 포함한 한 팀 인원이에요</p><div role="radiogroup">${SM.MODES.map((m) => `<button class="opt" role="radio" aria-checked="${m === SM.TEAM.mode}"><span>${parseInt(m)}인제<small>필드 ${parseInt(m) - 1}명 + 골키퍼</small></span>${m === SM.TEAM.mode ? `<span style="color:var(--blue)">${I('check', 22, 2.6)}</span>` : ''}</button>`).join('')}</div>`, '경기 인원');
  $('#sheet').querySelectorAll('.opt').forEach((b) => (b.onclick = () => { closeSheet(); toast('시안에서는 9인제만 보여줘요'); }));
}
function openShare() {
  openSheet(`<h3>이렇게 공유돼요</h3><p class="sd">링크로 열면 읽기 전용으로 보여요</p><pre class="brief">${SM.shareText(st.squad)}</pre>
    <div class="sacts" style="margin-top:12px"><button class="sa" id="sLink">${I('link', 22)}링크 복사</button><button class="sa" id="sImg">${I('image', 22)}이미지 저장</button><button class="sa" id="sFile">${I('file', 22)}파일 저장</button></div>
    <button class="cta" id="sCopy">텍스트 복사하기</button>`, '공유하기');
  $('#sCopy').onclick = async () => { const ok = await SM.copy(SM.shareText(st.squad)); closeSheet(); toast(ok ? '복사했어요. 단톡방에 붙여넣어 주세요' : '복사가 막혀 있어요. 직접 선택해 주세요'); };
  $('#sLink').onclick = () => toast('시안에서는 링크를 만들지 않아요');
  $('#sImg').onclick = $('#sFile').onclick = () => toast('시안에서는 저장하지 않아요');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });

function render(anim) {
  tabs();
  ({ lineup: viewLineup, pattern: viewPattern, match: viewMatch })[st.tab]();
  if (anim) { const v = $('#view'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
}
render();
</script>
