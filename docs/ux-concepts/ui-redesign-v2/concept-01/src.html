<title>스쿼드 메이커 매치데이</title>
<style>
/*@FONT@*/
/* Layout: mobile sports app. App bar → next-match card → squad segment → lineup pitch → note cards; bottom tab bar; sheets for detail.
   ≥960px: pitch column sticky left, cards right, tab bar floats centered. */
:root {
  --bg: #f1f3f6;
  --card: #ffffff;
  --ink: #0e1726;
  --sub: #667085;
  --hair: #e6e9ef;
  --accent: #00a862;         /* 경기장 그린 */
  --accent-ink: #ffffff;
  --accent-soft: #e3f6ec;
  --away: #e5484d;
  --grass-1: #2f9e5b; --grass-2: #2b9455;
  --chip: #eef1f5;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --sheet-shadow: 0 -10px 40px rgba(16,24,40,.18);
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1114; --card: #1a1d22; --ink: #f2f4f7; --sub: #98a2b3; --hair: #2a2f37; --accent: #22c47a; --accent-ink: #04170d; --accent-soft: #123826;
  --away: #ff6b6f; --grass-1: #1f6e40; --grass-2: #1c663b; --chip: #242830; --shadow: 0 1px 2px rgba(0,0,0,.3); --sheet-shadow: 0 -10px 40px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1114; --card: #1a1d22; --ink: #f2f4f7; --sub: #98a2b3; --hair: #2a2f37; --accent: #22c47a; --accent-ink: #04170d; --accent-soft: #123826;
  --away: #ff6b6f; --grass-1: #1f6e40; --grass-2: #1c663b; --chip: #242830; --shadow: 0 1px 2px rgba(0,0,0,.3); --sheet-shadow: 0 -10px 40px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.01em; padding-inline: 16px; padding-block: 0 112px; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }

.appbar-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin-inline: -16px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
.crest { width: 36px; height: 40px; flex: none; }
.crest.sm { width: 28px; height: 32px; }
.appbar .t { min-width: 0; flex: 1; }
.appbar .t b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.appbar .t span { display: block; font-size: 12.5px; color: var(--sub); }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
.iconbtn:active { transform: scale(.94); }

.wrap { max-width: 1080px; margin: 0 auto; }
.layout { display: grid; gap: 12px; }
.col { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 960px) {
  .layout { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .col.left { position: sticky; top: 72px; }
  .chips { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; }
}
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-h h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
.card-h .aside { margin-left: auto; font-size: 13px; color: var(--sub); }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--sub); }

/* Next match */
.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.team { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 13px; font-weight: 600; line-height: 1.3; min-width: 0; }
.kick { text-align: center; }
.kick b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.kick span { font-size: 12px; color: var(--sub); }
.dpill { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }

/* Segmented */
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; height: 36px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--sub); transition: color .2s; }
.seg button[aria-selected="true"] { color: var(--ink); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(16,24,40,.12); transition: transform .32s cubic-bezier(.3,1.3,.5,1); }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hair); background: var(--card); font-size: 14px; font-weight: 600; color: var(--sub); display: inline-flex; align-items: center; gap: 4px; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.chip.mode { color: var(--ink); }

/* Pitch */
.pitch-card { padding: 0; overflow: hidden; }
.pitch-top { display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px; }
.pitch-top b { font-size: 16px; font-weight: 700; }
.pitch-top .form { font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.pitch-top .aside { margin-left: auto; font-size: 12.5px; color: var(--sub); }
.pitch { position: relative; aspect-ratio: 68 / 92; touch-action: none; user-select: none; -webkit-user-select: none;
  background: repeating-linear-gradient(180deg, var(--grass-1) 0 9.09%, var(--grass-2) 9.09% 18.18%); }
.pitch::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.10), transparent 60%); pointer-events: none; }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: rgba(255,255,255,.42); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.pitch svg.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.run { fill: none; stroke: #fff; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.pass { fill: none; stroke: #ffd84d; stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.pl { position: absolute; z-index: 2; width: 64px; margin-left: -32px; margin-top: -19px; display: grid; justify-items: center; gap: 3px; border: 0; background: none; padding: 0; touch-action: none; color: #fff; }
.pl .disc { position: relative; width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 2px solid #fff; display: grid; place-items: center; font-size: 15px; font-weight: 800; box-shadow: 0 3px 8px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
.pl .disc.light { color: #1b1b1b; }
.pl .nm { font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
.pl .badge { position: absolute; right: -5px; top: -4px; width: 17px; height: 17px; border-radius: 50%; background: #fff; color: var(--grass-2); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.pl.sel .disc { transform: scale(1.12); box-shadow: 0 0 0 4px rgba(255,255,255,.45), 0 3px 8px rgba(0,0,0,.25); }
.pl.dragging .disc { transform: scale(1.2); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
.pl.dragging { z-index: 5; cursor: grabbing; }
.ball { position: absolute; z-index: 3; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4), inset -2px -2px 0 rgba(0,0,0,.12); pointer-events: none; }
.pitch-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; font-size: 12.5px; color: var(--sub); }

/* Rows */
.note-box { width: 100%; border: 0; background: var(--chip); border-radius: 14px; padding: 12px 14px; min-height: 84px; resize: none; line-height: 1.55; font-size: 15px; }
.note-box:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.progress { height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: -4px 0 8px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 18px; align-items: center; gap: 12px; padding: 10px 2px; border: 0; background: none; text-align: left; border-top: 1px solid var(--hair); min-height: 60px; }
.row:first-child { border-top: 0; }
.row:active { background: var(--chip); }
.row .no { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.row .no.light { color: #1b1b1b; }
.row .who { min-width: 0; }
.row .who b { display: block; font-size: 15px; font-weight: 600; }
.row .who span { display: block; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who span.empty { color: color-mix(in srgb, var(--sub) 70%, transparent); }
.tag { font-size: 11.5px; font-weight: 700; color: var(--sub); background: var(--chip); padding: 2px 7px; border-radius: 6px; }
.row .ico { color: var(--sub); }

/* Pattern */
.pat-head { display: flex; align-items: center; gap: 8px; }
.pat-head .t { flex: 1; min-width: 0; text-align: center; }
.pat-head .t b { display: block; font-size: 16px; font-weight: 700; }
.pat-head .t span { font-size: 12.5px; color: var(--sub); }
.steps { display: flex; align-items: center; gap: 8px; }
.step { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--hair); background: var(--card); font-weight: 700; display: grid; place-items: center; position: relative; overflow: hidden; color: var(--sub); }
.step[aria-current="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step i { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.step.add { flex: 0 0 44px; }
.playbtn { flex: 0 0 auto; height: 44px; padding: 0 18px 0 14px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.desc { font-size: 15px; font-weight: 600; margin: 0; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--sub); margin-top: 6px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px dashed var(--ink); vertical-align: middle; margin-right: 5px; }
.legend i.p { border-top-style: solid; border-color: #e0b400; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { height: 48px; border-radius: 14px; border: 0; background: var(--chip); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:active { transform: scale(.98); }

/* Match */
.info { display: grid; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); }
.info div { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.info .ico { color: var(--sub); }
pre.brief { margin: 0; white-space: pre-wrap; font-family: var(--font); font-size: 14px; line-height: 1.6; background: var(--chip); border-radius: 14px; padding: 14px; }

/* Tab bar */
.tabbar { position: fixed; z-index: 30; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(420px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(3, 1fr); background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 22px; box-shadow: 0 8px 30px rgba(16,24,40,.14), 0 0 0 1px var(--hair); padding: 6px; }
.tab { border: 0; background: none; height: 54px; border-radius: 16px; display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--sub); }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,20,.42); opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(520px, 100%); transform: translate(-50%, 105%); background: var(--card); border-radius: 24px 24px 0 0; box-shadow: var(--sheet-shadow); padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); transition: transform .38s cubic-bezier(.2,1,.3,1), visibility 0s linear .38s; max-height: 88vh; overflow-y: auto; visibility: hidden; }
.sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform .38s cubic-bezier(.2,1,.3,1); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--hair); margin: 0 auto 14px; }
.sh-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.sh-head .big { width: 56px; height: 56px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 800; }
.sh-head .big.light { color: #1b1b1b; }
.sh-head b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.sh-head span { font-size: 13.5px; color: var(--sub); }
.sh-head .iconbtn { margin-left: auto; box-shadow: none; background: var(--chip); }
.field-l { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin: 0 0 8px; }
.swatches { display: flex; gap: 10px; margin-bottom: 18px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); display: grid; place-items: center; color: #fff; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.act { border: 0; background: var(--chip); border-radius: 14px; padding: 12px 6px; display: grid; justify-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
.act.danger { color: var(--away); }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--card); font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: tin .3s cubic-bezier(.2,1,.3,1); white-space: nowrap; }
@keyframes tin { from { transform: translate(-50%, 12px); opacity: 0; } }
.fade-in { animation: fin .28s ease-out; }
@keyframes fin { from { opacity: .4; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<header class="appbar"><div class="appbar-in">
  <svg class="crest" viewBox="0 0 36 40" aria-hidden="true"><path d="M18 1 34 6v13c0 10-7 16.5-16 20C9 35.5 2 29 2 19V6Z" fill="#0e3b8c"/><path d="M18 5 30 9v10c0 7.7-5 12.8-12 15.8C11 31.8 6 26.7 6 19V9Z" fill="#1e5fd1"/><path d="M6 22c4-2 8 2 12 0s8-2 12 0" stroke="#fff" stroke-width="2" fill="none"/><path d="M6 26c4-2 8 2 12 0s8-2 12 0" stroke="#9cc3ff" stroke-width="2" fill="none"/><text x="18" y="18" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Pretendard, sans-serif">FC</text></svg>
  <div class="t"><b id="teamName"></b><span id="teamSub"></span></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="화면 테마 전환"></button>
  <button class="iconbtn" id="shareBtn" type="button" aria-label="공유"></button>
</div></header>

<div class="wrap"><div class="layout" id="view"></div></div>

<nav class="tabbar" role="tablist" aria-label="메뉴" id="tabbar"></nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="상세"></section>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/*@CORE@*/
</script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const I = SM.icon;
const st = { tab: 'lineup', squad: 'basic', sel: null, step: 0, playing: false };
const P = (id) => SM.PLAYERS.find((p) => p.id === +id);
const PALETTE = ['#1e5fd1', '#e5484d', '#f5b400', '#00a862', '#7c4dff', '#ffffff', '#1f2937'];
const isLight = (c) => c === '#ffffff' || c === '#f5b400';
SM.PLAYERS.forEach((p) => { p.color = p.role === 'GK' ? '#f5b400' : '#1e5fd1'; });

const crest = (a, b, txt) => `<svg class="crest" viewBox="0 0 36 40" aria-hidden="true"><path d="M18 1 34 6v13c0 10-7 16.5-16 20C9 35.5 2 29 2 19V6Z" fill="${a}"/><path d="M18 5 30 9v10c0 7.7-5 12.8-12 15.8C11 31.8 6 26.7 6 19V9Z" fill="${b}"/><text x="18" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" font-family="Pretendard, sans-serif">${txt}</text></svg>`;
$('#teamName').textContent = SM.TEAM.name;
$('#shareBtn').innerHTML = I('share', 20);
const dark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
const themeIcon = () => ($('#themeBtn').innerHTML = dark() ? '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>');
themeIcon();
$('#themeBtn').onclick = () => { document.documentElement.dataset.theme = dark() ? 'light' : 'dark'; themeIcon(); };

let tT;
function toast(msg, ic = 'check') { const t = $('#toast'); t.innerHTML = I(ic, 16) + msg; t.hidden = false; t.style.animation = 'none'; t.offsetWidth; t.style.animation = ''; clearTimeout(tT); tT = setTimeout(() => (t.hidden = true), 1900); }

const TABS = [['lineup', 'shirt', '라인업'], ['pattern', 'route', '전술 패턴'], ['match', 'calendar', '경기']];
function tabbar() {
  $('#tabbar').innerHTML = TABS.map(([k, ic, l]) => `<button class="tab" role="tab" aria-selected="${st.tab === k}" data-tab="${k}">${I(ic, 22)}<span>${l}</span></button>`).join('');
  $('#tabbar').querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { stop(); st.tab = b.dataset.tab; render(true); scrollTo({ top: 0, behavior: 'smooth' }); }));
}

const pitchHTML = (head) => `<section class="card pitch-card">${head}<div class="pitch" id="pitch">
  <svg class="lines" viewBox="0 0 68 92" preserveAspectRatio="none" aria-hidden="true"><rect x="3" y="3" width="62" height="86" rx="1"/><line x1="3" y1="46" x2="65" y2="46"/><circle cx="34" cy="46" r="7.5"/><circle cx="34" cy="46" r=".4"/><rect x="16" y="3" width="36" height="13"/><rect x="25" y="3" width="18" height="5"/><path d="M28 16 A7 7 0 0 0 40 16"/><rect x="16" y="76" width="36" height="13"/><rect x="25" y="84" width="18" height="5"/><path d="M28 76 A7 7 0 0 1 40 76"/></svg>
  <svg class="ov" id="ov" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg></div>`;

function matchCard(full) {
  const m = SM.match;
  return `<section class="card"><div class="card-h"><span class="eyebrow">다음 경기</span><span class="dpill num" style="margin-left:auto">D-7</span></div>
    <div class="match"><div class="team">${crest('#0e3b8c', '#1e5fd1', 'FC')}<span>한강 유나이티드</span></div>
    <div class="kick"><b class="num">09:00</b><span>10월 12일 (일)</span></div>
    <div class="team">${crest('#7a1220', '#d13a3a', 'GS')}<span>${m.opponent}</span></div></div>
    ${full ? `<div class="info"><div>${I('pin', 18)}${m.venue}</div><div>${I('clock', 18)}집합 08:30 · 경기 50분 (전후반 25분)</div><div>${I('users', 18)}9인제 · 참석 11명 / 교체 2명</div></div>` : ''}</section>`;
}

function viewLineup() {
  const s = SM.squads[st.squad];
  const done = SM.PLAYERS.filter((p) => s.notes[p.id]).length;
  const idx = Object.keys(SM.SQUAD_LABEL).indexOf(st.squad);
  const left = `${matchCard(false)}
    <div class="seg" role="tablist" aria-label="스쿼드">${Object.keys(SM.SQUAD_LABEL).map((k) => `<button role="tab" aria-selected="${k === st.squad}" data-sq="${k}">${SM.SQUAD_LABEL[k]}</button>`).join('')}<span class="thumb" style="transform:translateX(${idx * 100}%)"></span></div>
    <div class="chips" role="group" aria-label="포메이션"><button class="chip mode" type="button" id="modeChip">${I('users', 16)}${SM.TEAM.mode.replace(/vs\d+/, '')}인제${I('chevD', 16)}</button>${SM.FORMATIONS.map((f) => `<button class="chip num" aria-pressed="${f === s.formation}" data-f="${f}">${f}</button>`).join('')}</div>
    ${pitchHTML(`<div class="pitch-top"><b>${SM.SQUAD_LABEL[st.squad]} 스쿼드</b><span class="form num">${s.formation}</span><span class="aside">선수를 끌어서 배치</span></div>`)}
    <div class="pitch-foot">${I('msg', 15)}<span>말풍선은 개별 지침이 있는 선수예요</span></div></section>`;
  const right = `<section class="card"><div class="card-h"><h2>팀 전체 지침</h2><span class="aside">모두에게 공유돼요</span></div><textarea class="note-box" id="teamNote" aria-label="팀 전체 지침">${s.teamNote}</textarea></section>
    <section class="card"><div class="card-h"><h2>선수별 지침</h2><span class="aside num">${done}/${SM.PLAYERS.length} 작성</span></div><div class="progress"><i style="width:${(done / SM.PLAYERS.length) * 100}%"></i></div>
    <div class="rows">${SM.PLAYERS.map((p) => `<button class="row" data-pid="${p.id}"><span class="no num${isLight(p.color) ? ' light' : ''}" style="--c:${p.color}">${p.num}</span><span class="who"><b>${p.name}</b><span class="${s.notes[p.id] ? '' : 'empty'}">${s.notes[p.id] || '아직 지침이 없어요'}</span></span><span class="tag">${SM.roleFor(s.formation, p.id)}</span>${I('chevR', 18)}</button>`).join('')}</div></section>`;
  $('#view').innerHTML = `<div class="col left">${left}</div><div class="col">${right}</div>`;
  $('#view').querySelectorAll('[data-sq]').forEach((b) => (b.onclick = () => { st.squad = b.dataset.sq; render(); }));
  $('#view').querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { if (b.dataset.f === s.formation) return; s.formation = b.dataset.f; s.pos = SM.layout(s.formation); render(); toast(`${s.formation} 포메이션으로 바꿨어요`); }));
  $('#view').querySelectorAll('[data-pid]').forEach((b) => (b.onclick = () => openPlayer(+b.dataset.pid)));
  $('#modeChip').onclick = openMode;
  $('#teamNote').oninput = (e) => (s.teamNote = e.target.value);
  players(s.pos, null, true);
}

function viewPattern() {
  const steps = SM.pattern.steps;
  const left = `<section class="card"><div class="pat-head"><button class="iconbtn" aria-label="이전 패턴" style="box-shadow:none;background:var(--chip)">${I('chevL', 20)}</button><div class="t"><b>${SM.pattern.name}</b><span>패턴 1 / 3 · ${steps.length}단계</span></div><button class="iconbtn" aria-label="다음 패턴" style="box-shadow:none;background:var(--chip)">${I('chevR', 20)}</button></div></section>
    ${pitchHTML(`<div class="pitch-top"><b>${st.step + 1}단계</b><span class="aside">선수·공을 끌어 경로 그리기</span></div>`)}
    <div class="pitch-foot" style="justify-content:space-between"><span class="legend" style="margin:0"><span><i></i>선수 이동</span><span><i class="p"></i>패스</span></span><span>화살표를 누르면 삭제</span></div></section>`;
  const right = `<section class="card"><div class="steps">${steps.map((_, i) => `<button class="step num" data-step="${i}" aria-current="${i === st.step}" aria-label="${i + 1}단계">${i + 1}<i></i></button>`).join('')}<button class="step add" aria-label="단계 추가">${I('plus', 18)}</button><button class="playbtn" id="play">${I(st.playing ? 'pause' : 'play', 16)}${st.playing ? '정지' : '재생'}</button></div></section>
    <section class="card"><span class="eyebrow">${st.step + 1}단계 설명</span><p class="desc" style="margin-top:4px">${steps[st.step].label}</p></section>
    <section class="card"><div class="card-h"><h2>내보내기</h2><span class="aside">단톡방에 바로 올릴 수 있어요</span></div><div class="btnrow"><button class="btn primary" id="gif1">${I('download', 18)}이 패턴 GIF</button><button class="btn" id="gif2">${I('download', 18)}전체 패턴 GIF</button></div></section>`;
  $('#view').innerHTML = `<div class="col left">${left}</div><div class="col">${right}</div>`;
  $('#view').querySelectorAll('[data-step]').forEach((b) => (b.onclick = () => { stop(); st.step = +b.dataset.step; render(); }));
  $('#play').onclick = () => (st.playing ? (stop(), render()) : play());
  $('#gif1').onclick = $('#gif2').onclick = () => toast('시안에서는 저장하지 않아요', 'download');
  const f = SM.frame(st.step, 0); players(f.pos, f.ball, false); arrows(st.step);
}

function viewMatch() {
  const m = SM.match;
  $('#view').innerHTML = `<div class="col left">${matchCard(true)}<section class="card"><div class="card-h"><h2>감독 메모</h2></div><textarea class="note-box" aria-label="감독 메모">${m.memo}</textarea></section></div>
    <div class="col"><section class="card"><div class="card-h"><h2>전술 지침서</h2><span class="aside">${SM.SQUAD_LABEL[st.squad]} 스쿼드 기준</span></div><pre class="brief">${SM.shareText(st.squad)}</pre><div class="btnrow" style="margin-top:12px"><button class="btn primary" id="copyB">${I('copy', 18)}복사하기</button><button class="btn" id="txtB">${I('file', 18)}텍스트 저장</button></div></section></div>`;
  $('#copyB').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '지침서를 복사했어요' : '복사가 막혀 있어요. 직접 선택해 주세요', 'copy');
  $('#txtB').onclick = () => toast('시안에서는 저장하지 않아요', 'file');
}

const pitchEl = () => $('#pitch');
const toPct = (cx, cy) => { const r = pitchEl().getBoundingClientRect(); return { x: (cx - r.left) / r.width * 100, y: (cy - r.top) / r.height * 100 }; };
function players(pos, ball, editable) {
  const pitch = pitchEl(); const s = SM.squads[st.squad];
  pitch.querySelectorAll('.pl,.ball').forEach((n) => n.remove());
  SM.PLAYERS.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'pl' + (st.sel === p.id ? ' sel' : ''); b.type = 'button';
    b.style.left = pos[p.id].x + '%'; b.style.top = pos[p.id].y + '%';
    b.innerHTML = `<span class="disc num${isLight(p.color) ? ' light' : ''}" style="--c:${p.color}">${p.num}${editable && s.notes[p.id] ? `<span class="badge">${I('msg', 10, 2.6)}</span>` : ''}</span><span class="nm">${p.name}</span>`;
    b.setAttribute('aria-label', `${p.num}번 ${p.name}`);
    pitch.appendChild(b);
    if (editable) SM.draggable(b, toPct, {
      onMove: (q) => { s.pos[p.id] = q; b.style.left = q.x + '%'; b.style.top = q.y + '%'; },
      onEnd: () => toast(`${p.name} 위치를 옮겼어요`, 'check'),
      onTap: () => openPlayer(p.id),
    }); else b.tabIndex = -1;
  });
  if (ball) { const e = document.createElement('div'); e.className = 'ball'; e.style.left = ball.x + '%'; e.style.top = ball.y + '%'; pitch.appendChild(e); }
}
function arrows(step) {
  const ov = $('#ov');
  ov.innerHTML = step == null ? '' : `<defs><marker id="mr" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:#fff"/></marker><marker id="mp" viewBox="0 0 6 6" refX="4.5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6z" style="fill:#ffd84d"/></marker></defs>` +
    SM.arrows(step).map((a) => { const dx = a.to.x - a.from.x, dy = a.to.y - a.from.y, L = Math.hypot(dx, dy) || 1, k = 3.2 / L; return `<line class="${a.kind}" x1="${a.from.x + dx * k}" y1="${a.from.y + dy * k}" x2="${a.to.x - dx * k}" y2="${a.to.y - dy * k}" marker-end="url(#${a.kind === 'run' ? 'mr' : 'mp'})"/>`; }).join('');
}

let raf;
function stop() { st.playing = false; cancelAnimationFrame(raf); }
function play() {
  st.playing = true; const b = $('#play'); b.innerHTML = I('pause', 16) + '정지'; b.onclick = () => { stop(); render(); };
  arrows(null); const dur = SM.reduced() ? 1 : 1100, n = SM.pattern.steps.length; let t0 = null;
  const bars = [...document.querySelectorAll('.step i')];
  const tick = (ts) => {
    if (!st.playing) return; t0 ??= ts; const el = (ts - t0) / dur; const s = Math.floor(el) % (n + 1);
    const f = s < n ? SM.frame(s, el % 1) : SM.frame(n - 1, 1); players(f.pos, f.ball, false);
    bars.forEach((x, i) => (x.style.width = (i < s ? 100 : i === s ? (el % 1) * 100 : 0) + '%'));
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

/* Sheets */
let lastFocus;
function openSheet(html, label) {
  lastFocus = document.activeElement;
  const sh = $('#sheet'), sc = $('#scrim');
  sh.innerHTML = `<div class="grab"></div>${html}`; sh.setAttribute('aria-label', label);
  sc.hidden = false; requestAnimationFrame(() => { sc.classList.add('on'); sh.classList.add('on'); });
  sc.onclick = closeSheet;
  setTimeout(() => (sh.querySelector('textarea, button') || sh).focus({ preventScroll: true }), 50);
}
function closeSheet() {
  const sh = $('#sheet'), sc = $('#scrim'); sh.classList.remove('on'); sc.classList.remove('on');
  setTimeout(() => { sc.hidden = true; }, 260); st.sel = null; if (st.tab === 'lineup') render(); lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
}
function openPlayer(id) {
  const p = P(id), s = SM.squads[st.squad]; st.sel = id;
  pitchEl() && pitchEl().querySelectorAll('.pl').forEach((n, i) => n.classList.toggle('sel', SM.PLAYERS[i].id === id));
  openSheet(`<div class="sh-head"><span class="big num${isLight(p.color) ? ' light' : ''}" style="--c:${p.color}">${p.num}</span><div><b>${p.name}</b><span>${SM.roleFor(s.formation, p.id)} · ${SM.SQUAD_LABEL[st.squad]} 스쿼드</span></div><button class="iconbtn" id="shClose" aria-label="닫기">${I('x', 20)}</button></div>
    <span class="field-l">유니폼 색</span><div class="swatches">${PALETTE.map((c) => `<button class="swatch" style="--c:${c}" data-c="${c}" aria-label="색 ${c}" aria-pressed="${c === p.color}">${c === p.color ? `<span style="color:${isLight(c) ? '#1b1b1b' : '#fff'}">${I('check', 16, 3)}</span>` : ''}</button>`).join('')}</div>
    <label class="field-l" for="pNote">${p.name}에게만 보이는 지침</label><textarea class="note-box" id="pNote" placeholder="예) 공격 시 오른쪽 하프스페이스로 침투">${s.notes[p.id] || ''}</textarea>
    <div class="actions"><button class="act">${I('pencil', 20)}이름 변경</button><button class="act">${I('eye', 20)}선수 시점</button><button class="act danger">${I('trash', 20)}명단에서 빼기</button></div>`, `${p.name} 상세`);
  $('#shClose').onclick = closeSheet;
  $('#pNote').oninput = (e) => { s.notes[p.id] = e.target.value; };
  $('#sheet').querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { p.color = b.dataset.c; render(); openPlayer(id); }));
}
function openMode() {
  openSheet(`<div class="sh-head"><div><b>경기 인원</b><span>바꾸면 배치가 기본값으로 돌아가요</span></div><button class="iconbtn" id="shClose" aria-label="닫기">${I('x', 20)}</button></div>
    <div class="rows">${SM.MODES.map((m) => `<button class="row" style="grid-template-columns:1fr auto"><span class="who"><b>${m.replace(/vs\d+/, '')}인제</b><span>필드 ${parseInt(m) - 1}명 + 골키퍼</span></span>${m === SM.TEAM.mode ? `<span style="color:var(--accent)">${I('check', 20, 2.6)}</span>` : '<span></span>'}</button>`).join('')}</div>`, '경기 인원');
  $('#shClose').onclick = closeSheet;
  $('#sheet').querySelectorAll('.row').forEach((b) => (b.onclick = () => { closeSheet(); toast('시안에서는 9인제만 보여줘요', 'users'); }));
}
function openShare() {
  openSheet(`<div class="sh-head"><div><b>공유하기</b><span>${SM.SQUAD_LABEL[st.squad]} 스쿼드 · 링크로 열면 읽기 전용</span></div><button class="iconbtn" id="shClose" aria-label="닫기">${I('x', 20)}</button></div>
    <pre class="brief">${SM.shareText(st.squad)}</pre>
    <div class="actions"><button class="act" id="sCopy">${I('copy', 20)}텍스트 복사</button><button class="act" id="sLink">${I('link', 20)}링크 복사</button><button class="act" id="sImg">${I('image', 20)}이미지 저장</button></div>`, '공유하기');
  $('#shClose').onclick = closeSheet;
  $('#sCopy').onclick = async () => toast((await SM.copy(SM.shareText(st.squad))) ? '공유 텍스트를 복사했어요' : '복사가 막혀 있어요', 'copy');
  $('#sLink').onclick = () => toast('시안에서는 링크를 만들지 않아요', 'link');
  $('#sImg').onclick = () => toast('시안에서는 저장하지 않아요', 'image');
}
$('#shareBtn').onclick = openShare;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });

function render(anim) {
  const s = SM.squads[st.squad];
  $('#teamSub').textContent = `${SM.TEAM.mode.replace(/vs\d+/, '')}인제 · ${SM.SQUAD_LABEL[st.squad]} 스쿼드 ${s.formation}`;
  tabbar();
  ({ lineup: viewLineup, pattern: viewPattern, match: viewMatch })[st.tab]();
  if (anim) $('#view').classList.remove('fade-in'), void $('#view').offsetWidth, $('#view').classList.add('fade-in');
}
render();
</script>
