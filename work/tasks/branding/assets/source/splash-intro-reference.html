<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>런 라인 스플래시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=IBM+Plex+Sans+KR:wght@500&display=swap" rel="stylesheet">
<style>
  /* Concept 01 "Run Line" splash intro.
     Motion is CSS animations only (no rAF, no SMIL, no timers) so that
     document.getAnimations() can freeze any frame. Total length 1400ms.
     Default styles ARE the final state; keyframes supply the start state
     through fill-mode both, so prefers-reduced-motion just drops the animations. */
  :root {
    --bg: #141a16;
    --chalk: #e8ede8;
    --lime: #b8e986;
    --muted: #8fa096;
    --m: clamp(56px, 18vmin, 220px);      /* mark box */
    --F: calc(var(--m) * 0.42);           /* wordmark size */
    --gap: calc(var(--m) * 0.2);
    --ww: calc(var(--F) * 6.4);           /* fixed wordmark width so the centering shift is deterministic */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .lockup {
    display: flex;
    align-items: center;
    gap: var(--gap);
  }
  .mark {
    width: var(--m);
    height: var(--m);
    display: block;
    overflow: visible;
    animation: shift 500ms 900ms var(--ease-out) both;
  }
  .dot {
    transform-box: fill-box;
    transform-origin: center;
    animation: pop 260ms 0ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .reveal {
    stroke-dashoffset: 0;
    animation: draw 600ms 180ms cubic-bezier(0.45, 0, 0.2, 1) both;
  }
  .head {
    transform-box: view-box;
    transform-origin: 76px 25px;
    animation: snap 180ms 740ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .word {
    width: var(--ww);
    display: flex;
    flex-direction: column;
    gap: calc(var(--F) * 0.18);
    animation: word-in 440ms 960ms var(--ease-out) both;
  }
  .en {
    font-family: 'Oswald', 'Bahnschrift', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    font-weight: 600;
    font-size: var(--F);
    line-height: 1;
    letter-spacing: 0.04em;
    color: var(--chalk);
    white-space: nowrap;
  }
  .ko {
    font-family: 'IBM Plex Sans KR', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-weight: 500;
    font-size: calc(var(--F) * 0.42);
    line-height: 1;
    letter-spacing: 0.32em;
    color: var(--muted);
    white-space: nowrap;
  }

  @keyframes pop {
    0%   { transform: scale(0.2); opacity: 0; }
    45%  { opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes draw {
    from { stroke-dashoffset: 100; }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes snap {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  @keyframes shift {
    from { transform: translateX(calc((var(--ww) + var(--gap)) / 2)); }
    to   { transform: translateX(0); }
  }
  @keyframes word-in {
    from { opacity: 0; transform: translateX(calc(var(--F) * -0.5)); clip-path: inset(0 100% 0 0); }
    to   { opacity: 1; transform: translateX(0); clip-path: inset(0 0 0 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark, .dot, .reveal, .head, .word { animation: none; }
  }
</style>
</head>
<body>
  <div class="lockup" role="img" aria-label="스쿼드 메이커 SQUAD MAKER">
    <svg class="mark" viewBox="17 17 67 67" aria-hidden="true">
      <defs>
        <mask id="run-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
          <!-- solid stroke that sweeps along the run; lead-in/out cover the round caps -->
          <path class="reveal" d="M44 62.5 L48 62 C78 58 38 36 76 25 L79.8 23.9" pathLength="100"
                fill="none" stroke="#fff" stroke-width="14" stroke-dasharray="100 100"/>
        </mask>
      </defs>
      <circle class="dot" cx="33" cy="70" r="11" fill="#b8e986"/>
      <g mask="url(#run-reveal)">
        <path d="M48 62 C78 58 38 36 76 25" pathLength="100" fill="none" stroke="#e8ede8"
              stroke-width="6" stroke-linecap="round" stroke-dasharray="7.3 23.6"/>
      </g>
      <path class="head" d="M65.8 20.9 L76 25 L69.6 33.9" fill="none" stroke="#e8ede8"
            stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="word" aria-hidden="true">
      <span class="en">SQUAD MAKER</span>
      <span class="ko">스쿼드 메이커</span>
    </div>
  </div>
<script>
  // Tap to skip: jump every animation to its end state (no frame loop).
  document.addEventListener('pointerdown', function () {
    document.getAnimations().forEach(function (a) { a.finish(); });
  });
</script>
</body>
</html>
